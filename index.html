<title>Hộp Đồ Chơi Toán</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Hộp đồ chơi: viền mực dày + bóng lệch như đồ chơi nhựa; công thức viết trên bảng xanh lớp học. Một cột: thanh trên, sân khấu hình, lời dẫn, nút bấm to. */
:root{
  --sky:#e6f3fb; --ink:#1d2b3a; --ink-soft:#4a5b6c; --card:#ffffff; --paper:#fffaf0;
  --long:#f08a24; --wide:#2f7fd8; --sun:#ffd23f; --berry:#e8475f; --leaf:#4f9a45; --fence:#8a5a33;
  --board:#21473d; --chalk:#f4f7f2; --frame:#9a6a3e;
  --display:'Baloo 2','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-weight:700;-webkit-tap-highlight-color:transparent}
.app{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-size:clamp(22px,4vw,30px);margin:0;line-height:1;flex:1 1 auto;min-width:0}
.top h1 small{display:block;font-family:var(--body);font-size:13px;color:var(--ink-soft);font-weight:700;margin-top:4px;letter-spacing:.02em}
.chip{font-family:var(--display);font-weight:700;font-size:16px;border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip:focus-visible,.btn:focus-visible,.tile:focus-visible,.nbcard:focus-visible{outline:4px solid var(--wide);outline-offset:3px}
.chip.off{background:#e9eef2;color:var(--ink-soft)}
.dots{display:flex;gap:6px;width:100%}
.dots i{flex:1;height:8px;border-radius:8px;background:#c8dbe8}
.dots i.on{background:var(--long)}
.dots i.now{background:var(--berry)}
.stage{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:8px;overflow:hidden}
svg.scene{display:block;width:100%;height:auto;max-height:60vh;margin:0 auto}
svg.scene.drag{touch-action:none;cursor:grab}
svg text{font-family:var(--display);font-weight:700}
.caption{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px 18px;font-size:clamp(18px,2.7vw,23px);line-height:1.45;min-height:3.2em}
.caption b{font-weight:800}
.L{color:var(--long);font-weight:800}
.W{color:var(--wide);font-weight:800}
.key{color:var(--berry);font-weight:800}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{font-family:var(--display);font-weight:800;font-size:clamp(18px,2.6vw,22px);color:var(--ink);padding:10px 22px;border-radius:999px;border:3px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink);cursor:pointer;line-height:1.2}
.btn.go{background:var(--sun)}
.btn.ghost{background:#eef3f6}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.voicenote{font-size:14px;color:var(--ink-soft);font-weight:700}

/* Bảng công thức */
.board{background:var(--board);border:8px solid var(--frame);border-radius:14px;margin:8px;padding:12px 16px;color:var(--chalk);font-family:var(--display);font-size:clamp(19px,3vw,27px);line-height:1.3;display:flex;flex-direction:column;gap:6px}
.board .L{color:#ffb766}.board .W{color:#8fc6ff}.board .key{color:#ff9aa9}
.fline{opacity:0;transform:translateY(10px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.3,1)}
.fline.in{opacity:1;transform:none}
.memo{margin-top:6px;border:2px dashed var(--chalk);border-radius:10px;padding:8px 12px;font-family:var(--body);font-size:clamp(16px,2.3vw,19px);line-height:1.45}
.memo::before{content:'Ghi nhớ';display:inline-block;background:var(--sun);color:var(--ink);font-family:var(--display);border-radius:999px;padding:0 10px;margin-right:8px;font-size:14px}

/* Bản đồ */
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:8px}
.tile{position:relative;text-align:left;border:3px solid var(--ink);border-radius:18px;padding:14px;background:var(--paper);box-shadow:0 4px 0 var(--ink);cursor:pointer;display:flex;gap:12px;align-items:center;font:inherit;color:var(--ink)}
.tile svg{width:64px;height:64px;flex:none}
.tile h3{font-family:var(--display);font-size:22px;margin:0;line-height:1.1}
.tile p{margin:4px 0 0;font-size:15px;color:var(--ink-soft)}
.tile.lock{background:#eef2f5;cursor:default;box-shadow:0 4px 0 #9aa9b6;border-color:#9aa9b6}
.tile.lock h3,.tile.lock p{color:#7a8a98}
.tile.note{grid-column:1/-1;background:var(--board);color:var(--chalk);border-color:var(--ink)}
.tile.note p{color:#cfe0d8}
.tag{position:absolute;top:-11px;right:12px;font-family:var(--display);font-size:13px;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--sun);color:var(--ink)}
.tile.lock .tag{background:#fff;border-color:#9aa9b6;color:#7a8a98}
.tile.done .tag{background:var(--leaf);color:#fff}
.hello{font-family:var(--display);font-size:clamp(22px,3.6vw,28px);margin:6px 8px 0;line-height:1.2}

/* Sổ công thức */
.nb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:8px}
.nbhead{grid-column:1/-1;font-family:var(--display);font-size:22px;margin:4px 0 -4px}
.nbcard{text-align:left;font:inherit;border:6px solid var(--frame);border-radius:12px;background:var(--board);color:var(--chalk);padding:10px 14px;cursor:pointer;min-width:0}
.nbcard h4{margin:0;font-family:var(--body);font-size:15px;color:#cfe0d8}
.nbcard .f{font-family:var(--display);font-size:clamp(20px,3vw,26px);line-height:1.2;margin:2px 0}
.nbcard small{font-size:15px;color:#cfe0d8}
.nbcard.lock{background:#eef2f5;border-color:#c3ced8;color:#7a8a98;cursor:default}
.nbcard.lock h4,.nbcard.lock small{color:#7a8a98}

/* Giải mã tên */
.decode{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 8px 22px}
.word{display:flex;gap:.18em;font-family:var(--display);font-weight:800;font-size:clamp(50px,12vw,104px);line-height:1}
.syl{display:inline-block;padding:.05em .25em;border-radius:.2em;border:4px solid transparent;transition:background-color .5s,border-color .5s,transform .7s cubic-bezier(.34,1.3,.5,1);will-change:transform}
.word.split .syl{background:var(--sun);border-color:var(--ink);transform:translateX(-.35em) rotate(-3deg)}
.word.split .syl+.syl{background:#cfe4fb;transform:translateX(.35em) rotate(3deg)}
.means{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:720px}
.mean{display:flex;gap:12px;align-items:center;border:3px solid var(--ink);border-radius:16px;padding:12px;background:var(--paper);font-size:clamp(17px,2.4vw,21px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.3,1);min-width:0}
.mean.off,.sum.off{opacity:0;transform:translateY(10px)}
.mean svg{width:64px;height:64px;flex:none}
.mean small{display:block;font-size:15px;color:var(--ink-soft);margin-top:2px}
.sum{font-family:var(--display);font-size:clamp(20px,3vw,26px);text-align:center;background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:10px 18px;transition:opacity .5s,transform .5s;max-width:720px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:8px}
.chipcard{border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:var(--paper);font-size:19px;min-width:0}
.chipcard small{display:block;font-size:14px;color:var(--ink-soft)}
.draw{stroke-dasharray:100;animation:draw 3s linear infinite}
@keyframes draw{0%{stroke-dashoffset:100}70%,100%{stroke-dashoffset:0}}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.blink{animation:blink .7s ease-in-out 4}
@keyframes blink{50%{opacity:.15}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(1.5)}}
svg .pop,svg .blink,svg .pulse{transform-box:fill-box;transform-origin:center}
.hit{cursor:pointer}
.hit:focus{outline:none}

/* Kết thúc */
.done{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 8px 20px;text-align:center}
.done h2{font-family:var(--display);font-size:clamp(28px,5vw,40px);margin:0}
.done .nb{width:100%;max-width:760px;text-align:left}

@media (max-width:560px){
  .map,.means,.nb,.chips{grid-template-columns:1fr}
  .stage{padding:4px}
  .board{margin:4px;padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<div class="app">
  <header class="top">
    <button class="chip" id="home" hidden>← Bản đồ</button>
    <h1 id="title">Hộp Đồ Chơi Toán<small>Toán lớp 3 bằng hình và chuyển động</small></h1>
    <button class="chip" id="replay" title="Nghe lại câu vừa đọc">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      Nghe lại
    </button>
    <button class="chip" id="voice">Đọc to: Bật</button>
    <div class="dots" id="dots" hidden></div>
  </header>
  <main class="stage" id="stage"></main>
  <div class="caption" id="caption" aria-live="polite"></div>
  <div class="btns" id="btns"></div>
  <div class="voicenote" id="vnote"></div>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const stage=$('#stage'), cap=$('#caption'), btns=$('#btns');
const COL={long:'#f08a24',wide:'#2f7fd8',fence:'#8a5a33',post:'#5e3a1d',ink:'#1d2b3a',soft:'#4a5b6c',sun:'#ffd23f',berry:'#e8475f',leaf:'#4f9a45',grassA:'#9bd585',grassB:'#8ccb75',tape:'#ffe27a',grid:'#d6e6f5',paper:'#fbfdff'};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const S={w:null,i:-1,voice:true,guess:undefined};
let run=0;

/* ---------- tiện ích hoạt hình ---------- */
const ease=p=>-(Math.cos(Math.PI*p)-1)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?30:ms));
function tween(ms,fn){return new Promise(res=>{if(reduce)ms=60;const t0=performance.now();function f(t){const p=Math.min(1,(t-t0)/ms);fn(ease(p),p);p<1?requestAnimationFrame(f):res();}requestAnimationFrame(f);});}
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function txt(parent,x,y,s,attrs={}){const t=el('text',Object.assign({x,y,'text-anchor':'middle',fill:COL.ink,'font-size':18},attrs),parent);t.textContent=s;return t;}
function addSvg(h=330){const s=el('svg',{viewBox:`0 0 560 ${h}`,class:'scene',role:'img'});stage.appendChild(s);return s;}
function newSvg(h=330){stage.innerHTML='';return addSvg(h);}
function popEl(e){e.classList.remove('pop');void e.getBoundingClientRect();e.classList.add('pop');}
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function onDrag(svg,fn){
  let on=false;svg.classList.add('drag');
  svg.addEventListener('pointerdown',e=>{on=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}fn(svgPt(svg,e),'down');e.preventDefault();});
  svg.addEventListener('pointermove',e=>{if(on)fn(svgPt(svg,e),'move');});
  const up=()=>{if(on){on=false;fn(null,'up');}};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}

/* ---------- âm thanh ---------- */
let ac;
function tone(f=880,d=.14,type='sine',v=.14){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
const ting=()=>{tone(1047,.15);setTimeout(()=>tone(1568,.22),90);};
const click=()=>tone(660,.07,'square',.06);
const boop=()=>{tone(330,.2,'triangle',.14);setTimeout(()=>tone(262,.25,'triangle',.12),150);};
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.15),i*130));

/* ---------- giọng đọc tiếng Việt ---------- */
let viVoice=null,lastSay='';
function pickVoice(){
  if(!('speechSynthesis' in window))return showVoiceNote();
  const vs=speechSynthesis.getVoices().filter(v=>/^vi/i.test(v.lang));
  viVoice=vs.find(v=>/natural|online|hoaimy|namminh/i.test(v.name))||vs.find(v=>/google/i.test(v.name))||vs[0]||null;
  showVoiceNote();
}
function showVoiceNote(){
  $('#vnote').textContent=viVoice?'':'Máy này chưa có giọng đọc tiếng Việt nên app chỉ hiện chữ. Trên máy tính Windows, mở bằng trình duyệt Edge sẽ có giọng đọc; điện thoại Android và iPhone thường có sẵn.';
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;setTimeout(pickVoice,800);}else showVoiceNote();
function say(t){
  lastSay=t;
  if(!S.voice||!viVoice)return;
  if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.voice=viVoice;u.lang=viVoice.lang;u.rate=.9;u.pitch=1.05;speechSynthesis.speak(u);},60);
}
$('#replay').onclick=()=>{const v=S.voice;S.voice=true;say(lastSay);S.voice=v;};
$('#voice').onclick=()=>{S.voice=!S.voice;const b=$('#voice');b.textContent='Đọc to: '+(S.voice?'Bật':'Tắt');b.classList.toggle('off',!S.voice);if(!S.voice&&'speechSynthesis' in window)speechSynthesis.cancel();};

/* ---------- khung bài ---------- */
function talk(html,voice){cap.innerHTML=html;say(voice??cap.textContent);}
function buttons(list){btns.innerHTML='';list.forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.kind||'');e.innerHTML=b.label;e.onclick=()=>{if(e.disabled)return;b.on(e);};btns.appendChild(e);});}
function lockButtons(on){btns.querySelectorAll('button').forEach(b=>b.disabled=on);}
function start(){const tok=++run;if('speechSynthesis' in window)speechSynthesis.cancel();btns.innerHTML='';return()=>tok===run;}
function board(){
  const d=document.createElement('div');d.className='board';stage.appendChild(d);
  const add=(html,cls='fline')=>{const p=document.createElement('div');p.className=cls;p.innerHTML=html;d.appendChild(p);requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add('in')));tone(520,.08,'triangle',.08);return p;};
  return {el:d,add,memo:html=>add(html,'fline memo')};
}
const isDone=k=>{try{return localStorage.getItem(k)==='1';}catch(e){return false;}};
const setDone=k=>{try{localStorage.setItem(k,'1');}catch(e){}};

/* ---------- các thế giới ---------- */
const WORLDS={
  fence:{title:'Thế Giới Hàng Rào',sub:'Chu vi, nửa chu vi',key:'hangrao-xong',screens:[]},
  circle:{title:'Thế Giới Hình Tròn',sub:'Tâm, bán kính, đường kính, trung điểm',key:'hinhtron-xong',screens:[]}
};
function go(w,i=0){
  S.w=w;S.i=i;
  const W=WORLDS[w];
  $('#home').hidden=!w;
  $('#dots').hidden=!W;
  if(W){
    $('#title').innerHTML=`${W.title}<small>${W.sub}</small>`;
    $('#dots').innerHTML=W.screens.map((_,k)=>`<i class="${k<i?'on':k===i?'now':''}"></i>`).join('');
  } else if(w==='note') $('#title').innerHTML='Sổ Công Thức<small>Chạm vào một công thức để nghe đọc</small>';
  else $('#title').innerHTML='Hộp Đồ Chơi Toán<small>Toán lớp 3 bằng hình và chuyển động</small>';
  window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
  if(W)W.screens[i]();else if(w==='note')sNotebook();else sHome();
  if(!reduce&&stage.animate){stage.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:320,easing:'cubic-bezier(.2,.8,.3,1)'});}
}
const next=()=>go(S.w,S.i+1);
$('#home').onclick=()=>go(null);

/* ---------- đồ vật dùng chung ---------- */
function field(svg,ox,oy,Lm,Wm,k,opt={}){
  const u=opt.unit||'m';
  const P={A:{x:ox,y:oy},B:{x:ox+Lm*k,y:oy},C:{x:ox+Lm*k,y:oy+Wm*k},D:{x:ox,y:oy+Wm*k}};
  const defs=el('defs',{},svg);
  const pat=el('pattern',{id:'grass',x:ox,y:0,width:k,height:k,patternUnits:'userSpaceOnUse'},defs);
  el('rect',{width:k,height:k,fill:COL.grassA},pat);el('rect',{width:k/2,height:k,fill:COL.grassB},pat);
  el('rect',{x:ox,y:oy,width:Lm*k,height:Wm*k,fill:opt.fill||'url(#grass)'},svg);
  if(opt.veg){for(let r=0;r<Wm;r++)for(let c=0;c<Lm;c++){el('circle',{cx:ox+c*k+k/2,cy:oy+r*k+k/2,r:7,fill:'#3f8a3a'},svg);el('circle',{cx:ox+c*k+k/2-3,cy:oy+r*k+k/2-3,r:3,fill:'#7dc56c'},svg);}}
  el('rect',{x:ox,y:oy,width:Lm*k,height:Wm*k,fill:'none',stroke:opt.frame||COL.fence,'stroke-width':opt.frame?8:4},svg);
  if(!opt.noPosts){
    const posts=el('g',{fill:COL.post},svg);
    for(let i=0;i<=Lm;i++){el('circle',{cx:ox+i*k,cy:oy,r:3.2},posts);el('circle',{cx:ox+i*k,cy:oy+Wm*k,r:3.2},posts);}
    for(let j=1;j<Wm;j++){el('circle',{cx:ox,cy:oy+j*k,r:3.2},posts);el('circle',{cx:ox+Lm*k,cy:oy+j*k,r:3.2},posts);}
  }
  const cW=opt.square?COL.long:COL.wide;
  const lab={
    top:txt(svg,ox+Lm*k/2,oy-12,Lm+' '+u,{fill:COL.long,'font-size':20}),
    bottom:txt(svg,ox+Lm*k/2,oy+Wm*k+26,Lm+' '+u,{fill:COL.long,'font-size':20}),
    left:txt(svg,ox-12,oy+Wm*k/2+7,Wm+' '+u,{fill:cW,'font-size':20,'text-anchor':'end'}),
    right:txt(svg,ox+Lm*k+12,oy+Wm*k/2+7,Wm+' '+u,{fill:cW,'font-size':20,'text-anchor':'start'})
  };
  if(opt.letters){
    txt(svg,ox-12,oy-6,'A',{'font-size':15,fill:COL.soft});txt(svg,ox+Lm*k+12,oy-6,'B',{'font-size':15,fill:COL.soft});
    txt(svg,ox+Lm*k+12,oy+Wm*k+18,'C',{'font-size':15,fill:COL.soft});txt(svg,ox-12,oy+Wm*k+18,'D',{'font-size':15,fill:COL.soft});
  }
  return {P,lab};
}
function legend(svg,x,y){
  el('line',{x1:x,y1:y,x2:x+28,y2:y,stroke:COL.long,'stroke-width':8,'stroke-linecap':'round'},svg);
  txt(svg,x+38,y+6,'chiều dài',{'text-anchor':'start','font-size':16,fill:COL.soft});
  el('line',{x1:x,y1:y+28,x2:x+28,y2:y+28,stroke:COL.wide,'stroke-width':8,'stroke-linecap':'round'},svg);
  txt(svg,x+38,y+34,'chiều rộng',{'text-anchor':'start','font-size':16,fill:COL.soft});
}
function makeCar(svg){
  const g=el('g',{},svg);
  [[-13,-12],[5,-12],[-13,7],[5,7]].forEach(([x,y])=>el('rect',{x,y,width:9,height:5,rx:2,fill:'#222'},g));
  el('rect',{x:-17,y:-9,width:34,height:18,rx:7,fill:COL.berry,stroke:COL.ink,'stroke-width':2},g);
  el('rect',{x:3,y:-6.5,width:8,height:13,rx:3,fill:'#cdeeff'},g);
  el('rect',{x:-12,y:-6,width:11,height:12,rx:3,fill:'#f47b8e'},g);
  return {g,x:0,y:0,a:0,put(x,y,a){this.x=x;this.y=y;this.a=a;g.setAttribute('transform',`translate(${x} ${y}) rotate(${a})`);}};
}
/* Lái xe theo một đường gấp khúc: tăng tốc êm, chạy đều, vào cua mượt, phanh êm ở cuối */
const angDiff=(a,b)=>((b-a)%360+540)%360-180;
function trap(p,a=.18){const v=1/(1-a);if(p<a)return v*p*p/(2*a);if(p>1-a){const q=1-p;return 1-v*q*q/(2*a);}return v*(p-a/2);}
function drivePath(svg,car,pts,opt={}){
  const segs=[];let total=0,mTot=0;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],len=Math.hypot(b.x-a.x,b.y-a.y);
    const m=(opt.meters&&opt.meters[i])||len/K;
    segs.push({a,b,len,h:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI,s0:total,m0:mTot,m,c:(opt.colors&&opt.colors[i])||COL.berry});total+=len;mTot+=m;}
  const startA=car.a,RT=18,lines=segs.map(()=>null);let corner=-1;
  const mk=j=>{const g=segs[j];const l=el('line',{x1:g.a.x,y1:g.a.y,x2:g.a.x,y2:g.a.y,stroke:g.c,'stroke-width':opt.w||8,'stroke-linecap':'round','stroke-dasharray':opt.dash||'none'});if(opt.cls)l.classList.add(opt.cls);svg.insertBefore(l,car.g);return l;};
  const end=(l,q)=>{l.setAttribute('x2',q.x);l.setAttribute('y2',q.y);};
  const ms=Math.max(800,mTot*(opt.ms||300));
  return tween(ms,(e,p)=>{
    const s=trap(p)*total;
    let i=segs.findIndex(g=>s<g.s0+g.len);if(i<0)i=segs.length-1;
    for(let j=0;j<i;j++){if(!lines[j])lines[j]=mk(j);end(lines[j],segs[j].b);if(corner<j){corner=j;opt.onCorner&&opt.onCorner(j);}}
    const g=segs[i],d=Math.min(g.len,Math.max(0,s-g.s0)),t=g.len?d/g.len:1;
    const x=lerp(g.a.x,g.b.x,t),y=lerp(g.a.y,g.b.y,t);
    if(!lines[i])lines[i]=mk(i);end(lines[i],{x,y});
    let ang=g.h;
    if(i===0){const R=RT*2;if(d<R){const f=d/R;ang=startA+angDiff(startA,g.h)*(f*f*(3-2*f));}}
    else if(d<RT){const ph=segs[i-1].h;ang=ph+angDiff(ph,g.h)*(.5+.5*d/RT);}
    if(i<segs.length-1&&g.len-d<RT){const f=.5*(1-(g.len-d)/RT);ang=g.h+angDiff(g.h,segs[i+1].h)*f;}
    car.put(x,y,ang);
    if(opt.onT)opt.onT(g.m0+g.m*t);
  }).then(()=>{segs.forEach((g,j)=>{if(!lines[j])lines[j]=mk(j);end(lines[j],g.b);if(corner<j){corner=j;opt.onCorner&&opt.onCorner(j);}});
    const last=segs[segs.length-1];car.put(last.b.x,last.b.y,last.h);return lines;});
}
/* xoay và đặt một đoạn thẳng nằm ngang, giữ nguyên độ dài */
function morph(line,tx,ty,ms=900){
  const x1=+line.getAttribute('x1'),y1=+line.getAttribute('y1'),x2=+line.getAttribute('x2'),y2=+line.getAttribute('y2');
  const L=Math.hypot(x2-x1,y2-y1),mx=(x1+x2)/2,my=(y1+y2)/2,a0=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  const d=((0-a0)%360+540)%360-180;
  return tween(ms,t=>{const a=(a0+d*t)*Math.PI/180,cx=lerp(mx,tx+L/2,t),cy=lerp(my,ty,t);
    line.setAttribute('x1',cx-Math.cos(a)*L/2);line.setAttribute('y1',cy-Math.sin(a)*L/2);line.setAttribute('x2',cx+Math.cos(a)*L/2);line.setAttribute('y2',cy+Math.sin(a)*L/2);});
}
function slide(g,dx,dy,ms=800){return tween(ms,t=>g.setAttribute('transform',`translate(${dx*t} ${dy*t})`));}
function tape(svg,x,y,units,k,opt={}){
  const every=opt.every||5,u=opt.unit||'m';
  const g=el('g',{opacity:0},svg);
  el('rect',{x:x-4,y,width:units*k+8,height:22,rx:4,fill:COL.tape,stroke:COL.ink,'stroke-width':2},g);
  for(let i=0;i<=units;i++){const big=i%every===0||i===units;el('line',{x1:x+i*k,y1:y,x2:x+i*k,y2:y+(big?14:8),stroke:COL.ink,'stroke-width':big?2:1.2},g);
    if(big)txt(g,x+i*k,y+40,i===units?i+' '+u:String(i),{'font-size':15,fill:COL.soft});}
  return g;
}
const fadeIn=g=>tween(500,t=>g.setAttribute('opacity',t));
function flag(svg,x,y){el('line',{x1:x,y1:y,x2:x,y2:y-34,stroke:COL.ink,'stroke-width':3},svg);el('path',{d:`M${x} ${y-34} L${x+22} ${y-27} L${x} ${y-20}Z`,fill:COL.sun,stroke:COL.ink,'stroke-width':2},svg);}
function gridPaper(svg,h,step=24){
  el('rect',{x:0,y:0,width:560,height:h,fill:COL.paper},svg);
  const g=el('g',{stroke:COL.grid,'stroke-width':1},svg);
  for(let x=0;x<=560;x+=step)el('line',{x1:x,y1:0,x2:x,y2:h},g);
  for(let y=0;y<=h;y+=step)el('line',{x1:0,y1:y,x2:560,y2:y},g);
}

  el('path',{d:`M${P.x} ${P.y-16} H${P.x+16} V${P.y}`,fill:'none',stroke:COL.soft,'stroke-width':2},svg);
  const sides=[{a:P,b:Q,m:4,lx:280,ly:310},{a:Q,b:R,m:5,lx:300,ly:202},{a:R,b:P,m:3,lx:182,ly:226,anchor:'end'}];
  txt(svg,470,118,'Con đang cộng',{'font-size':16,fill:COL.soft});
  const sumT=txt(svg,470,150,'',{'font-size':22,fill:COL.berry});
  const showSum=()=>{const c=sides.filter(s=>s.sel).map(s=>s.m);sumT.textContent=c.length?c.join(' + '):'';};
  sides.forEach(s=>{
    s.sel=false;
    s.vis=el('line',{x1:s.a.x,y1:s.a.y,x2:s.b.x,y2:s.b.y,stroke:COL.fence,'stroke-width':5,'stroke-linecap':'round'},svg);
    s.lab=txt(svg,s.lx,s.ly,s.m+' m',{'font-size':22,'text-anchor':s.anchor||'middle'});
    s.hit=el('line',{x1:s.a.x,y1:s.a.y,x2:s.b.x,y2:s.b.y,stroke:'#000','stroke-opacity':0,'stroke-width':34,'pointer-events':'stroke',class:'hit',tabindex:0,role:'button','aria-label':'Cạnh '+s.m+' mét'},svg);
    const toggle=()=>{s.sel=!s.sel;click();s.vis.setAttribute('stroke',s.sel?COL.sun:COL.fence);s.vis.setAttribute('stroke-width',s.sel?12:5);s.lab.setAttribute('fill',s.sel?COL.berry:COL.ink);popEl(s.lab);showSum();};
    s.hit.addEventListener('click',toggle);
    s.hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
  });
  const car=makeCar(svg);car.put(P.x,P.y,0);

       'Đổi sang mảnh vườn hình tam giác. Muốn tính chu vi, con phải cộng những cạnh nào? Chạm vào các cạnh để chọn, rồi bấm xe chạy thử.');
  const tryRun=async()=>{
    if(!sides.some(s=>s.sel)){boop();talk('Con chưa chọn cạnh nào cả. Chạm vào cạnh của tam giác trước nhé!');return;}

const CM=24;

function makeCompass(svg,O){
  const g=el('g',{},svg);
  const l1=el('line',{stroke:'#7d8a96','stroke-width':7,'stroke-linecap':'round'},g);
  const l2=el('line',{stroke:'#9aa7b3','stroke-width':7,'stroke-linecap':'round'},g);
  const hinge=el('circle',{r:9,fill:COL.ink},g);
  const knob=el('line',{stroke:COL.ink,'stroke-width':6,'stroke-linecap':'round'},g);
  const pen=el('circle',{r:5,fill:COL.berry,stroke:COL.ink,'stroke-width':1.5},g);
  el('circle',{cx:O.x,cy:O.y,r:4,fill:COL.ink},g);
  return {set(r,deg){const a=deg*Math.PI/180,px=O.x+r*Math.cos(a),py=O.y+r*Math.sin(a);
    const mx=(O.x+px)/2,my=(O.y+py)/2,nx=Math.sin(a),ny=-Math.cos(a),hx=mx+nx*70,hy=my+ny*70;
    l1.setAttribute('x1',O.x);l1.setAttribute('y1',O.y);l1.setAttribute('x2',hx);l1.setAttribute('y2',hy);
    l2.setAttribute('x1',hx);l2.setAttribute('y1',hy);l2.setAttribute('x2',px);l2.setAttribute('y2',py);
    hinge.setAttribute('cx',hx);hinge.setAttribute('cy',hy);
    knob.setAttribute('x1',hx);knob.setAttribute('y1',hy);knob.setAttribute('x2',hx+nx*16);knob.setAttribute('y2',hy+ny*16);
    pen.setAttribute('cx',px);pen.setAttribute('cy',py);},g};
}

  const set=deg=>{ang=deg;const a=deg*Math.PI/180,px=O.x+r*Math.cos(a),py=O.y+r*Math.sin(a),qx=2*O.x-px,qy=2*O.y-py;

function cPlay(){
  const alive=start();
  const H=288;const svg=newSvg(H);gridPaper(svg,H);
  const O={x:288,y:144};
  const circ=el('circle',{cx:O.x,cy:O.y,fill:'#fff8',stroke:COL.ink,'stroke-width':3},svg);
  const spokes=el('g',{stroke:COL.long,'stroke-width':3,opacity:.7},svg);
  const dia=el('line',{stroke:COL.berry,'stroke-width':4,'stroke-dasharray':'8 6'},svg);
  const rad=el('line',{stroke:COL.long,'stroke-width':7,'stroke-linecap':'round'},svg);
  el('circle',{cx:O.x,cy:O.y,r:5,fill:COL.ink},svg);
  const rl=txt(svg,0,0,'',{'font-size':18,fill:COL.long});
  const ring=el('circle',{r:17,fill:'none',stroke:COL.sun,'stroke-width':4,class:'pulse'},svg);
  const h=el('circle',{r:12,fill:COL.sun,stroke:COL.ink,'stroke-width':2.5},svg);
  const bd=board();
  const l1=bd.add(''),l2=bd.add('');
  let r=3,ang=-35,showSpokes=false,lastSaid=0,R=3*CM,shown=-1;
  const draw=()=>{
    const a=ang*Math.PI/180,px=O.x+R*Math.cos(a),py=O.y+R*Math.sin(a);
    circ.setAttribute('r',R);
    rad.setAttribute('x1',O.x);rad.setAttribute('y1',O.y);rad.setAttribute('x2',px);rad.setAttribute('y2',py);
    dia.setAttribute('x1',2*O.x-px);dia.setAttribute('y1',2*O.y-py);dia.setAttribute('x2',O.x);dia.setAttribute('y2',O.y);
    h.setAttribute('cx',px);h.setAttribute('cy',py);ring.setAttribute('cx',px);ring.setAttribute('cy',py);
    rl.setAttribute('x',(O.x+px)/2+18*Math.sin(a));rl.setAttribute('y',(O.y+py)/2-18*Math.cos(a)+6);rl.textContent=r+' cm';
    const sp=spokes.children;
    if(showSpokes&&!sp.length)for(let k=0;k<8;k++)el('line',{},spokes);
    if(!showSpokes&&sp.length)spokes.innerHTML='';
    for(let k=0;k<sp.length;k++){const b=a+k*Math.PI/4;sp[k].setAttribute('x1',O.x);sp[k].setAttribute('y1',O.y);sp[k].setAttribute('x2',O.x+R*Math.cos(b));sp[k].setAttribute('y2',O.y+R*Math.sin(b));}
    if(shown!==r){shown=r;l1.innerHTML=`<span class="L">Bán kính</span> = ${r} cm`;l2.innerHTML=`<span class="key">Đường kính</span> = ${r} × 2 = ${r*2} cm`;}
  };
  draw();
  let dragging=false,want=R;
  const loop=()=>{if(!alive())return;const goal=dragging?want:r*CM;R+=(goal-R)*.28;draw();requestAnimationFrame(loop);};
  requestAnimationFrame(loop);
  const speakNow=()=>say(`Bán kính ${r} xăng-ti-mét. Đường kính bằng ${r} nhân hai, bằng ${r*2} xăng-ti-mét.`);
  onDrag(svg,(p,phase)=>{
    if(phase==='up'){dragging=false;if(r!==lastSaid){lastSaid=r;speakNow();}return;}
    dragging=true;ring.remove();
    const d=Math.hypot(p.x-O.x,p.y-O.y);
    want=Math.max(1.6*CM,Math.min(5.3*CM,d));
    const nr=Math.max(2,Math.min(5,Math.round(d/CM)));
    if(nr!==r){r=nr;click();}
    ang=Math.atan2(p.y-O.y,p.x-O.x)*180/Math.PI;
  });
  talk('Đến lượt con! <b>Kéo chấm vàng</b>: kéo ra xa thì hình tròn to ra, kéo vào gần thì nhỏ lại. Nhìn bảng: bán kính đổi thì đường kính đổi theo, luôn <b>gấp 2</b>.',
       'Đến lượt con! Kéo chấm vàng: kéo ra xa thì hình tròn to ra, kéo vào gần thì nhỏ lại. Nhìn bảng: bán kính đổi thì đường kính đổi theo, luôn gấp hai.');
  lastSaid=r;
  buttons([{label:'Thêm nan hoa xe đạp',on:b=>{showSpokes=!showSpokes;ting();b.textContent=showSpokes?'Bỏ nan hoa':'Thêm nan hoa xe đạp';
      if(showSpokes)talk('Bánh xe đạp có nhiều <b>nan hoa</b> đi từ trục giữa ra vành. Mỗi nan hoa là một <b class="key">bán kính</b>, và chúng <b>dài bằng nhau hết</b>. Nếu không bằng nhau, bánh xe sẽ méo!',
                         'Bánh xe đạp có nhiều nan hoa đi từ trục giữa ra vành. Mỗi nan hoa là một bán kính, và chúng dài bằng nhau hết. Nếu không bằng nhau, bánh xe sẽ méo!');}},
           {label:'Tiếp ▸',kind:'go',on:next}]);
}

function cMidpoint(){
  const alive=start();
  stage.innerHTML=`<div class="chips">
    <div class="chipcard"><b class="key">TRUNG</b> = ở giữa<small>miền Trung nằm giữa miền Bắc và miền Nam · Trung thu là giữa mùa thu</small></div>
    <div class="chipcard"><b class="key">ĐIỂM</b> = một dấu chấm<small>TRUNG ĐIỂM = dấu chấm nằm chính giữa</small></div></div>`;
  const H=290;const svg=addSvg(H);
  const U=50,X0=80,PY=158,GY=215;
  el('rect',{x:0,y:GY,width:560,height:H-GY,fill:'#eef3f6'},svg);
  el('line',{x1:20,y1:GY,x2:540,y2:GY,stroke:COL.soft,'stroke-width':3},svg);
  const rg=el('g',{style:'transform-box:view-box;transition:transform .6s cubic-bezier(.55,0,.35,1)'},svg);
  el('rect',{x:X0,y:PY-22,width:8*U,height:22,rx:3,fill:'#ffe9a8',stroke:COL.ink,'stroke-width':2},rg);
  for(let i=0;i<=16;i++){const big=i%2===0;el('line',{x1:X0+i*U/2,y1:PY-22,x2:X0+i*U/2,y2:PY-22+(big?10:6),stroke:COL.ink,'stroke-width':big?1.6:1},rg);if(big)txt(rg,X0+i*U/2,PY-3,String(i/2),{'font-size':10,fill:COL.soft});}
  txt(rg,X0,PY-30,'A',{'font-size':20});txt(rg,X0+8*U,PY-30,'B',{'font-size':20});
  const fg=el('g',{style:'transition:transform .35s cubic-bezier(.2,.8,.3,1)'},svg);
  el('path',{d:`M0 ${PY} L-24 ${GY} L24 ${GY} Z`,fill:COL.fence,stroke:COL.ink,'stroke-width':2,'stroke-linejoin':'round'},fg);
  txt(fg,0,GY-10,'M',{'font-size':18,fill:'#fff'});
  const meas=el('g',{},svg);
  let m=2,solved=false,fx=null;
  const update=speak=>{
    const Mx=X0+m*U;fg.style.transform=`translateX(${fx??Mx}px)`;
    let a=0;const drop=GY-PY;
    if(m<4)a=Math.asin(drop/((8-m)*U))*180/Math.PI;else if(m>4)a=-Math.asin(drop/(m*U))*180/Math.PI;
    rg.style.transformOrigin=`${Mx}px ${PY}px`;rg.style.transform=`rotate(${a}deg)`;
    meas.innerHTML='';
    el('line',{x1:X0,y1:245,x2:Mx,y2:245,stroke:COL.long,'stroke-width':6,'stroke-linecap':'round'},meas);
    el('line',{x1:Mx,y1:245,x2:X0+8*U,y2:245,stroke:COL.wide,'stroke-width':6,'stroke-linecap':'round'},meas);
    el('circle',{cx:Mx,cy:245,r:5,fill:COL.ink},meas);
    txt(meas,(X0+Mx)/2,273,`AM = ${m} cm`,{'font-size':17,fill:COL.long});
    txt(meas,(Mx+X0+8*U)/2,273,`MB = ${8-m} cm`,{'font-size':17,fill:COL.wide});
    if(!speak)return;
    if(m===4){
      ting();
      talk('Thước <b>thăng bằng</b> rồi! AM = MB = <b>4 cm</b>. M nằm giữa A và B, và chia AB thành <b>hai phần bằng nhau</b>. M là <b class="key">TRUNG ĐIỂM</b> của đoạn AB.',
           'Thước thăng bằng rồi! A M bằng M B bằng bốn xăng-ti-mét. M nằm giữa A và B, và chia A B thành hai phần bằng nhau. M là trung điểm của đoạn A B.');
      if(!solved){solved=true;
        const bd=board();
        bd.add('AM = MB = <span class="key">4 cm</span>');
        bd.add('AM = MB = AB : 2 = 8 : 2 = 4 cm');
        bd.add('Tâm O là <span class="key">trung điểm</span> của đường kính');
        bd.memo('Trung điểm M của đoạn AB: M nằm giữa A và B, và AM = MB.');
        setButtons();}
    } else {
      boop();
      talk(`M vẫn nằm <b>ở giữa</b> A và B, nhưng AM = ${m} cm, MB = ${8-m} cm: <b>chưa bằng nhau</b> nên thước bị đổ. M chưa phải trung điểm. Dời M tiếp đi!`,
           `M vẫn nằm ở giữa A và B, nhưng A M bằng ${m} xăng-ti-mét, M B bằng ${8-m} xăng-ti-mét, chưa bằng nhau nên thước bị đổ. M chưa phải trung điểm. Dời M tiếp đi!`);
    }
  };
  const setButtons=()=>{const l=[{label:'◀ Dời M sang trái',on:()=>{if(m>1){m--;click();update(true);}}},{label:'Dời M sang phải ▶',on:()=>{if(m<7){m++;click();update(true);}}}];
    if(solved)l.push({label:'Câu đố ▸',kind:'go',on:next});buttons(l);};
  update(false);
  onDrag(svg,(p,phase)=>{
    if(phase==='up'){fx=null;fg.style.transition='transform .35s cubic-bezier(.2,.8,.3,1)';update(true);return;}
    fg.style.transition='none';
    fx=Math.max(X0+.6*U,Math.min(X0+7.4*U,p.x));

       'Cái thước kẻ A B dài tám xăng-ti-mét đặt trên cục gỗ M. Con kéo cục gỗ, hoặc bấm nút, để thước nằm thăng bằng, không đổ về bên nào.');
  setButtons();
}
