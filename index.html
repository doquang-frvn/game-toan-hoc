<title>Hộp Đồ Chơi Toán</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Hộp đồ chơi: viền mực dày + bóng lệch như đồ chơi nhựa; công thức viết trên bảng xanh lớp học. Một cột: thanh trên, sân khấu hình, lời dẫn, nút bấm to. */
:root{
  --sky:#e6f3fb; --ink:#1d2b3a; --ink-soft:#4a5b6c; --card:#ffffff; --paper:#fffaf0;
  --long:#f08a24; --wide:#2f7fd8; --sun:#ffd23f; --berry:#e8475f; --leaf:#4f9a45; --fence:#8a5a33;
  --board:#21473d; --chalk:#f4f7f2; --frame:#9a6a3e;
  --display:'Baloo 2','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{background:var(--sky);color:var(--ink)}
[hidden]{display:none!important}
body{font-family:var(--body);font-weight:700;-webkit-tap-highlight-color:transparent}
.app{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-size:clamp(22px,4vw,30px);margin:0;line-height:1;flex:1 1 auto;min-width:0}
.top h1 small{display:block;font-family:var(--body);font-size:13px;color:var(--ink-soft);font-weight:700;margin-top:4px;letter-spacing:.02em}
.chip{font-family:var(--display);font-weight:700;font-size:16px;border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip:focus-visible,.btn:focus-visible,.tile:focus-visible,.nbcard:focus-visible{outline:4px solid var(--wide);outline-offset:3px}
.chip.off{background:#e9eef2;color:var(--ink-soft)}
.dots{display:flex;gap:6px;width:100%}
.dots i{flex:1;height:8px;border-radius:8px;background:#c8dbe8}
.dots i.on{background:var(--long)}
.dots i.now{background:var(--berry)}
.stage{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:8px;overflow:hidden}
svg.scene{display:block;width:100%;height:auto;max-height:60vh;margin:0 auto}
svg.scene.drag{touch-action:none;cursor:grab}
svg text{font-family:var(--display);font-weight:700}
.caption{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px 18px;font-size:clamp(18px,2.7vw,23px);line-height:1.45;min-height:3.2em}
.caption b{font-weight:800}
.L{color:var(--long);font-weight:800}
.W{color:var(--wide);font-weight:800}
.key{color:var(--berry);font-weight:800}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{font-family:var(--display);font-weight:800;font-size:clamp(18px,2.6vw,22px);color:var(--ink);padding:10px 22px;border-radius:999px;border:3px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink);cursor:pointer;line-height:1.2}
.btn.go{background:var(--sun)}
.btn.ghost{background:#eef3f6}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.voicenote{font-size:14px;color:var(--ink-soft);font-weight:700}

/* Bảng công thức */
.board{background:var(--board);border:8px solid var(--frame);border-radius:14px;margin:8px;padding:12px 16px;color:var(--chalk);font-family:var(--display);font-size:clamp(19px,3vw,27px);line-height:1.3;display:flex;flex-direction:column;gap:6px}
.board .L{color:#ffb766}.board .W{color:#8fc6ff}.board .key{color:#ff9aa9}
.fline{opacity:0;transform:translateY(10px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.3,1)}
.fline.in{opacity:1;transform:none}
.memo{margin-top:6px;border:2px dashed var(--chalk);border-radius:10px;padding:8px 12px;font-family:var(--body);font-size:clamp(16px,2.3vw,19px);line-height:1.45}
.memo::before{content:'Ghi nhớ';display:inline-block;background:var(--sun);color:var(--ink);font-family:var(--display);border-radius:999px;padding:0 10px;margin-right:8px;font-size:14px}

/* Bản đồ */
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:8px}
.tile{position:relative;text-align:left;border:3px solid var(--ink);border-radius:18px;padding:14px;background:var(--paper);box-shadow:0 4px 0 var(--ink);cursor:pointer;display:flex;gap:12px;align-items:center;font:inherit;color:var(--ink)}
.tile svg{width:64px;height:64px;flex:none}
.tile h3{font-family:var(--display);font-size:22px;margin:0;line-height:1.1}
.tile p{margin:4px 0 0;font-size:15px;color:var(--ink-soft)}
.tile.lock{background:#eef2f5;cursor:default;box-shadow:0 4px 0 #9aa9b6;border-color:#9aa9b6}
.tile.lock h3,.tile.lock p{color:#7a8a98}
.tile.note{grid-column:1/-1;background:var(--board);color:var(--chalk);border-color:var(--ink)}
.tile.note p{color:#cfe0d8}
.tag{position:absolute;top:-11px;right:12px;font-family:var(--display);font-size:13px;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--sun);color:var(--ink)}
.tile.lock .tag{background:#fff;border-color:#9aa9b6;color:#7a8a98}
.tile.done .tag{background:var(--leaf);color:#fff}
.hello{font-family:var(--display);font-size:clamp(22px,3.6vw,28px);margin:6px 8px 0;line-height:1.2}

/* Sổ công thức */
.nb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:8px}
.nbhead{grid-column:1/-1;font-family:var(--display);font-size:22px;margin:4px 0 -4px}
.nbcard{text-align:left;font:inherit;border:6px solid var(--frame);border-radius:12px;background:var(--board);color:var(--chalk);padding:10px 14px;cursor:pointer;min-width:0}
.nbcard h4{margin:0;font-family:var(--body);font-size:15px;color:#cfe0d8}
.nbcard .f{font-family:var(--display);font-size:clamp(20px,3vw,26px);line-height:1.2;margin:2px 0}
.nbcard small{font-size:15px;color:#cfe0d8}
.nbcard.lock{background:#eef2f5;border-color:#c3ced8;color:#7a8a98;cursor:default}
.nbcard.lock h4,.nbcard.lock small{color:#7a8a98}

/* Giải mã tên */
.decode{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 8px 22px}
.word{display:flex;gap:.18em;font-family:var(--display);font-weight:800;font-size:clamp(50px,12vw,104px);line-height:1}
.syl{display:inline-block;padding:.05em .25em;border-radius:.2em;border:4px solid transparent;transition:background-color .5s,border-color .5s,transform .7s cubic-bezier(.34,1.3,.5,1);will-change:transform}
.word.split .syl{background:var(--sun);border-color:var(--ink);transform:translateX(-.35em) rotate(-3deg)}
.word.split .syl+.syl{background:#cfe4fb;transform:translateX(.35em) rotate(3deg)}
.means{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:720px}
.mean{display:flex;gap:12px;align-items:center;border:3px solid var(--ink);border-radius:16px;padding:12px;background:var(--paper);font-size:clamp(17px,2.4vw,21px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.3,1);min-width:0}
.mean.off,.sum.off{opacity:0;transform:translateY(10px)}
.mean svg{width:64px;height:64px;flex:none}
.mean small{display:block;font-size:15px;color:var(--ink-soft);margin-top:2px}
.sum{font-family:var(--display);font-size:clamp(20px,3vw,26px);text-align:center;background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:10px 18px;transition:opacity .5s,transform .5s;max-width:720px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:8px}
.chipcard{border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:var(--paper);font-size:19px;min-width:0}
.chipcard small{display:block;font-size:14px;color:var(--ink-soft)}
.draw{stroke-dasharray:100;animation:draw 3s linear infinite}
@keyframes draw{0%{stroke-dashoffset:100}70%,100%{stroke-dashoffset:0}}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.blink{animation:blink .7s ease-in-out 4}
@keyframes blink{50%{opacity:.15}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(1.5)}}
svg .pop,svg .blink,svg .pulse{transform-box:fill-box;transform-origin:center}
.hit{cursor:pointer}
.hit:focus{outline:none}

/* Kết thúc */
.done{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 8px 20px;text-align:center}
.done h2{font-family:var(--display);font-size:clamp(28px,5vw,40px);margin:0}
.done .nb{width:100%;max-width:760px;text-align:left}

/* Luyện não */
.hero{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 8px 0}
.hero .hello{margin:0}
.pillstat{font-family:var(--display);font-size:15px;border:3px solid var(--ink);border-radius:999px;background:var(--sun);padding:3px 12px;box-shadow:0 2px 0 var(--ink)}
.drill{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:8px}
.skill{position:relative;text-align:left;font:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--ink);padding:12px 14px;cursor:pointer;min-width:0}
.skill:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.skill h4{margin:0;font-family:var(--display);font-size:19px}
.skill p{margin:3px 0 0;font-size:14px;color:var(--ink-soft)}
.skill .stars{position:absolute;top:-12px;right:10px;font-size:14px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;font-family:var(--display);color:var(--long)}
.skill.mix{grid-column:1/-1;background:#fff3c4}
.qbig{font-family:var(--display);font-size:clamp(44px,10vw,76px);text-align:center;margin:20px 0 8px;letter-spacing:.03em}
.qmeta{display:flex;justify-content:center;align-items:center;gap:16px;padding:12px 0 16px;font-family:var(--display);font-size:17px}
.qdots{display:flex;gap:7px}
.qdots i{width:14px;height:14px;border-radius:50%;background:#d6e2ec;border:2px solid var(--ink)}
.qdots i.ok{background:var(--leaf)}
.qdots i.bad{background:var(--berry)}
.streak{color:var(--long)}
/* Tủ huy chương */
.trophy{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:8px;align-items:start}
.medal{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-family:var(--display);text-align:center;color:var(--ink)}
.medal svg{width:72px;height:72px}
.medal.off{opacity:.35;filter:grayscale(1)}
.cup{grid-column:1/-1;display:flex;align-items:center;gap:14px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);padding:10px 14px}
.cup svg{width:84px;height:84px;flex:none}
.cup b{font-family:var(--display);font-size:20px}
.cup p{margin:2px 0 0;font-size:15px;color:var(--ink-soft)}

@media (max-width:560px){
  .map,.means,.nb,.chips,.drill{grid-template-columns:1fr}
  .trophy{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage{padding:4px}
  .board{margin:4px;padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<div class="app">
  <header class="top">
    <button class="chip" id="home" hidden>← Bản đồ</button>
    <h1 id="title">Hộp Đồ Chơi Toán<small>Toán lớp 3 bằng hình và chuyển động</small></h1>
    <button class="chip" id="replay" title="Nghe lại câu vừa đọc">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      Nghe lại
    </button>
    <button class="chip" id="voice">Đọc to: Bật</button>
    <div class="dots" id="dots" hidden></div>
  </header>
  <main class="stage" id="stage"></main>
  <div class="caption" id="caption" aria-live="polite"></div>
  <div class="btns" id="btns"></div>
  <div class="voicenote" id="vnote"></div>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const stage=$('#stage'), cap=$('#caption'), btns=$('#btns');
const COL={long:'#f08a24',wide:'#2f7fd8',fence:'#8a5a33',post:'#5e3a1d',ink:'#1d2b3a',soft:'#4a5b6c',sun:'#ffd23f',berry:'#e8475f',leaf:'#4f9a45',grassA:'#9bd585',grassB:'#8ccb75',tape:'#ffe27a',grid:'#d6e6f5',paper:'#fbfdff'};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const S={w:null,i:-1,voice:true,guess:undefined};
let run=0;

/* ---------- tiện ích hoạt hình ---------- */
const ease=p=>-(Math.cos(Math.PI*p)-1)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?30:ms));
function tween(ms,fn){return new Promise(res=>{if(reduce)ms=60;const t0=performance.now();function f(t){const p=Math.min(1,(t-t0)/ms);fn(ease(p),p);p<1?requestAnimationFrame(f):res();}requestAnimationFrame(f);});}
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function txt(parent,x,y,s,attrs={}){const t=el('text',Object.assign({x,y,'text-anchor':'middle',fill:COL.ink,'font-size':18},attrs),parent);t.textContent=s;return t;}
function addSvg(h=330){const s=el('svg',{viewBox:`0 0 560 ${h}`,class:'scene',role:'img'});stage.appendChild(s);return s;}
function newSvg(h=330){stage.innerHTML='';return addSvg(h);}
function popEl(e){e.classList.remove('pop');void e.getBoundingClientRect();e.classList.add('pop');}
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function onDrag(svg,fn){
  let on=false;svg.classList.add('drag');
  svg.addEventListener('pointerdown',e=>{on=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}fn(svgPt(svg,e),'down');e.preventDefault();});
  svg.addEventListener('pointermove',e=>{if(on)fn(svgPt(svg,e),'move');});
  const up=()=>{if(on){on=false;fn(null,'up');}};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}

/* ---------- âm thanh ---------- */
let ac;
function tone(f=880,d=.14,type='sine',v=.14){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
const ting=()=>{tone(1047,.15);setTimeout(()=>tone(1568,.22),90);};
const click=()=>tone(660,.07,'square',.06);
const boop=()=>{tone(330,.2,'triangle',.14);setTimeout(()=>tone(262,.25,'triangle',.12),150);};
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.15),i*130));

/* ---------- giọng đọc tiếng Việt ---------- */
let viVoice=null,lastSay='';
function pickVoice(){
  if(!('speechSynthesis' in window))return showVoiceNote();
  const vs=speechSynthesis.getVoices().filter(v=>/^vi/i.test(v.lang));
  viVoice=vs.find(v=>/natural|online|hoaimy|namminh/i.test(v.name))||vs.find(v=>/google/i.test(v.name))||vs[0]||null;
  showVoiceNote();
}
function showVoiceNote(){
  $('#vnote').textContent=viVoice?'':'Máy này chưa có giọng đọc tiếng Việt nên app chỉ hiện chữ. Trên máy tính Windows, mở bằng trình duyệt Edge sẽ có giọng đọc; điện thoại Android và iPhone thường có sẵn.';
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;setTimeout(pickVoice,800);}else showVoiceNote();
function say(t){
  lastSay=t;
  if(!S.voice||!viVoice)return;
  if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.voice=viVoice;u.lang=viVoice.lang;u.rate=.9;u.pitch=1.05;speechSynthesis.speak(u);},60);
}
$('#replay').onclick=()=>{const v=S.voice;S.voice=true;say(lastSay);S.voice=v;};
$('#voice').onclick=()=>{S.voice=!S.voice;const b=$('#voice');b.textContent='Đọc to: '+(S.voice?'Bật':'Tắt');b.classList.toggle('off',!S.voice);if(!S.voice&&'speechSynthesis' in window)speechSynthesis.cancel();};

/* ---------- khung bài ---------- */
function talk(html,voice){cap.innerHTML=html;say(voice??cap.textContent);}
function buttons(list){btns.innerHTML='';list.forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.kind||'');e.innerHTML=b.label;e.onclick=()=>{if(e.disabled)return;b.on(e);};btns.appendChild(e);});}
function lockButtons(on){btns.querySelectorAll('button').forEach(b=>b.disabled=on);}
function start(){const tok=++run;if('speechSynthesis' in window)speechSynthesis.cancel();btns.innerHTML='';return()=>tok===run;}
function board(){
  const d=document.createElement('div');d.className='board';stage.appendChild(d);
  const add=(html,cls='fline')=>{const p=document.createElement('div');p.className=cls;p.innerHTML=html;d.appendChild(p);requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add('in')));tone(520,.08,'triangle',.08);return p;};
  return {el:d,add,memo:html=>add(html,'fline memo')};
}
const isDone=k=>{try{return localStorage.getItem(k)==='1';}catch(e){return false;}};
const setDone=k=>{try{localStorage.setItem(k,'1');}catch(e){}};

/* ---------- các thế giới ---------- */
const WORLDS={
  fence:{title:'Thế Giới Hàng Rào',sub:'Chu vi, nửa chu vi',key:'hangrao-xong',screens:[]},
  circle:{title:'Thế Giới Hình Tròn',sub:'Tâm, bán kính, đường kính, trung điểm',key:'hinhtron-xong',screens:[]}
};
function go(w,i=0){
  S.w=w;S.i=i;
  const W=WORLDS[w];
  $('#home').hidden=!w;
  $('#dots').hidden=!W;
  if(W){
    $('#title').innerHTML=`${W.title}<small>${W.sub}</small>`;
    $('#dots').innerHTML=W.screens.map((_,k)=>`<i class="${k<i?'on':k===i?'now':''}"></i>`).join('');
  } else if(w==='note') $('#title').innerHTML='Sổ Công Thức<small>Chạm vào một công thức để nghe đọc</small>';
  else if(w==='trophy') $('#title').innerHTML='Tủ Huy Chương<small>Thành tích và phần thưởng của con</small>';
  else $('#title').innerHTML='Hộp Đồ Chơi Toán<small>Toán lớp 3 bằng hình và chuyển động</small>';
  if(w==='drill')$('#dots').hidden=true;
  window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
  if(W)W.screens[i]();else if(w==='note')sNotebook();else if(w==='trophy')sTrophy();else sHome();
  if(!reduce&&stage.animate){stage.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:320,easing:'cubic-bezier(.2,.8,.3,1)'});}
}
const next=()=>go(S.w,S.i+1);
$('#home').onclick=()=>go(null);

/* ---------- đồ vật dùng chung ---------- */
function field(svg,ox,oy,Lm,Wm,k,opt={}){
  const u=opt.unit||'m';
  const P={A:{x:ox,y:oy},B:{x:ox+Lm*k,y:oy},C:{x:ox+Lm*k,y:oy+Wm*k},D:{x:ox,y:oy+Wm*k}};
  const defs=el('defs',{},svg);
  const pat=el('pattern',{id:'grass',x:ox,y:0,width:k,height:k,patternUnits:'userSpaceOnUse'},defs);
  el('rect',{width:k,height:k,fill:COL.grassA},pat);el('rect',{width:k/2,height:k,fill:COL.grassB},pat);
  el('rect',{x:ox,y:oy,width:Lm*k,height:Wm*k,fill:opt.fill||'url(#grass)'},svg);

/* Lái xe theo một đường gấp khúc: tăng tốc êm, chạy đều, vào cua mượt, phanh êm ở cuối */
const angDiff=(a,b)=>((b-a)%360+540)%360-180;
function trap(p,a=.18){const v=1/(1-a);if(p<a)return v*p*p/(2*a);if(p>1-a){const q=1-p;return 1-v*q*q/(2*a);}return v*(p-a/2);}
function drivePath(svg,car,pts,opt={}){
  const segs=[];let total=0,mTot=0;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],len=Math.hypot(b.x-a.x,b.y-a.y);
    const m=(opt.meters&&opt.meters[i])||len/K;
    segs.push({a,b,len,h:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI,s0:total,m0:mTot,m,c:(opt.colors&&opt.colors[i])||COL.berry});total+=len;mTot+=m;}
  const startA=car.a,RT=18,lines=segs.map(()=>null);let corner=-1;
  const mk=j=>{const g=segs[j];const l=el('line',{x1:g.a.x,y1:g.a.y,x2:g.a.x,y2:g.a.y,stroke:g.c,'stroke-width':opt.w||8,'stroke-linecap':'round','stroke-dasharray':opt.dash||'none'});if(opt.cls)l.classList.add(opt.cls);svg.insertBefore(l,car.g);return l;};
  const end=(l,q)=>{l.setAttribute('x2',q.x);l.setAttribute('y2',q.y);};
  const ms=Math.max(800,mTot*(opt.ms||300));
  return tween(ms,(e,p)=>{
    const s=trap(p)*total;
    let i=segs.findIndex(g=>s<g.s0+g.len);if(i<0)i=segs.length-1;
    for(let j=0;j<i;j++){if(!lines[j])lines[j]=mk(j);end(lines[j],segs[j].b);if(corner<j){corner=j;opt.onCorner&&opt.onCorner(j);}}
    const g=segs[i],d=Math.min(g.len,Math.max(0,s-g.s0)),t=g.len?d/g.len:1;
    const x=lerp(g.a.x,g.b.x,t),y=lerp(g.a.y,g.b.y,t);
    if(!lines[i])lines[i]=mk(i);end(lines[i],{x,y});
    let ang=g.h;
    if(i===0){const R=RT*2;if(d<R){const f=d/R;ang=startA+angDiff(startA,g.h)*(f*f*(3-2*f));}}
    else if(d<RT){const ph=segs[i-1].h;ang=ph+angDiff(ph,g.h)*(.5+.5*d/RT);}
    if(i<segs.length-1&&g.len-d<RT){const f=.5*(1-(g.len-d)/RT);ang=g.h+angDiff(g.h,segs[i+1].h)*f;}
    car.put(x,y,ang);
    if(opt.onT)opt.onT(g.m0+g.m*t);
  }).then(()=>{segs.forEach((g,j)=>{if(!lines[j])lines[j]=mk(j);end(lines[j],g.b);if(corner<j){corner=j;opt.onCorner&&opt.onCorner(j);}});
    const last=segs[segs.length-1];car.put(last.b.x,last.b.y,last.h);return lines;});
}
/* xoay và đặt một đoạn thẳng nằm ngang, giữ nguyên độ dài */
function morph(line,tx,ty,ms=900){
  const x1=+line.getAttribute('x1'),y1=+line.getAttribute('y1'),x2=+line.getAttribute('x2'),y2=+line.getAttribute('y2');
  const L=Math.hypot(x2-x1,y2-y1),mx=(x1+x2)/2,my=(y1+y2)/2,a0=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  const d=((0-a0)%360+540)%360-180;
  return tween(ms,t=>{const a=(a0+d*t)*Math.PI/180,cx=lerp(mx,tx+L/2,t),cy=lerp(my,ty,t);
    line.setAttribute('x1',cx-Math.cos(a)*L/2);line.setAttribute('y1',cy-Math.sin(a)*L/2);line.setAttribute('x2',cx+Math.cos(a)*L/2);line.setAttribute('y2',cy+Math.sin(a)*L/2);});
}
function slide(g,dx,dy,ms=800){return tween(ms,t=>g.setAttribute('transform',`translate(${dx*t} ${dy*t})`));}
function tape(svg,x,y,units,k,opt={}){
  const every=opt.every||5,u=opt.unit||'m';

  el('rect',{x:x-4,y,width:units*k+8,height:22,rx:4,fill:COL.tape,stroke:COL.ink,'stroke-width':2},g);
  for(let i=0;i<=units;i++){const big=i%every===0||i===units;el('line',{x1:x+i*k,y1:y,x2:x+i*k,y2:y+(big?14:8),stroke:COL.ink,'stroke-width':big?2:1.2},g);
    if(big)txt(g,x+i*k,y+40,i===units?i+' '+u:String(i),{'font-size':15,fill:COL.soft});}
  return g;
}

function fDrive(){
  const alive=start();
  const svg=newSvg(330);const f=field(svg,FX,FY,6,4,K,{letters:true});legend(svg,430,80);
  const {A,B,C,D}=f.P;
  txt(svg,100,92,'Xe đã đi',{'font-size':17,fill:COL.soft});
  const num=txt(svg,100,138,'0 m',{'font-size':44,fill:COL.berry});
  const car=makeCar(svg);car.put(A.x,A.y,0);
  const edges=[{a:A,b:B,m:6,c:COL.long,lab:f.lab.top},{a:B,b:C,m:4,c:COL.wide,lab:f.lab.right},{a:C,b:D,m:6,c:COL.long,lab:f.lab.bottom},{a:D,b:A,m:4,c:COL.wide,lab:f.lab.left}];
  const lines=[];let idx=0,total=0;
  const says=[
    ['Cạnh thứ nhất: <span class="L">6 m</span>. Xe đã đi <b>6 m</b>.','Cạnh thứ nhất: sáu mét.'],
    ['Thêm <span class="W">4 m</span>: 6 + 4 = <b>10 m</b>.','Thêm bốn mét. Sáu cộng bốn bằng mười mét.'],
    ['Thêm <span class="L">6 m</span>: 10 + 6 = <b>16 m</b>.','Thêm sáu mét. Mười cộng sáu bằng mười sáu mét.'],
    ['Thêm <span class="W">4 m</span>: 16 + 4 = <b>20 m</b>. Xe về đúng chỗ xuất phát rồi!','Thêm bốn mét. Mười sáu cộng bốn bằng hai mươi mét. Xe về đúng chỗ xuất phát rồi!']];
  talk('Mỗi lần con bấm <b>Đi tiếp</b>, xe chạy hết một cạnh sân. Con nhìn số mét bên trái nhé!','Mỗi lần con bấm đi tiếp, xe chạy hết một cạnh sân. Con nhìn số mét bên trái nhé!');
  const step=async()=>{
    lockButtons(true);
    const e=edges[idx];const from=total;
    lines.push((await drivePath(svg,car,[e.a,e.b],{meters:[e.m],colors:[e.c],onT:v=>{num.textContent=Math.round(from+v)+' m';}}))[0]);
    if(!alive())return;
    total+=e.m;num.textContent=total+' m';popEl(e.lab);popEl(num);ting();
    talk(says[idx][0],says[idx][1]);idx++;
    if(idx<4){lockButtons(false);return;}
    await wait(2200);if(!alive())return;
    talk('Xe vừa đi hết <b>một vòng</b> quanh sân. Độ dài cả vòng đó gọi là <b class="key">CHU VI</b> của sân. Giờ mình tháo hàng rào ra, duỗi thẳng xem nó dài bao nhiêu!',
         'Xe vừa đi hết một vòng quanh sân. Độ dài cả vòng đó gọi là chu vi của sân. Giờ mình tháo hàng rào ra, duỗi thẳng xem nó dài bao nhiêu!');
    buttons([{label:'Duỗi thẳng hàng rào ra',kind:'go',on:unfold}]);
  };
  const unfold=async()=>{
    lockButtons(true);
    const tp=tape(svg,20,262,20,K);await fadeIn(tp);
    let x=20;
    for(let i=0;i<4;i++){
      if(!alive())return;
      await morph(lines[i],x,255,800);
      txt(svg,x+edges[i].m*K/2,243,edges[i].m+' m',{'font-size':17,fill:edges[i].c});
      tone(700+i*120,.12);x+=edges[i].m*K;
    }
    if(!alive())return;ting();
    let cmp='',cmpv='';
    if(S.guess===20){cmp=' Con đoán đúng ngay từ đầu, giỏi quá!';cmpv=cmp;}
    else if(typeof S.guess==='number'){cmp=` Lúc nãy con đoán ${S.guess} m, giờ con đã thấy tận mắt là 20 m.`;cmpv=` Lúc nãy con đoán ${S.guess} mét, giờ con đã thấy tận mắt là hai mươi mét.`;}
    talk(`Hàng rào duỗi thẳng thành một sợi dài: <span class="L">6</span> + <span class="W">4</span> + <span class="L">6</span> + <span class="W">4</span> = <b class="key">20 m</b>. Chu vi sân bóng là 20 m.${cmp}`,
         `Hàng rào duỗi thẳng thành một sợi dài. Sáu cộng bốn cộng sáu cộng bốn bằng hai mươi mét. Chu vi sân bóng là hai mươi mét.${cmpv}`);
    buttons([{label:'Viết thành công thức ▸',kind:'go',on:next}]);
  };
  buttons([{label:'Đi tiếp ▸',kind:'go',on:step}]);
}

    buttons([{label:'Câu đố ▸',kind:'go',on:next}]);

const CM=24;

function makeCompass(svg,O){
  const g=el('g',{},svg);
  const l1=el('line',{stroke:'#7d8a96','stroke-width':7,'stroke-linecap':'round'},g);
  const l2=el('line',{stroke:'#9aa7b3','stroke-width':7,'stroke-linecap':'round'},g);
  const hinge=el('circle',{r:9,fill:COL.ink},g);
  const knob=el('line',{stroke:COL.ink,'stroke-width':6,'stroke-linecap':'round'},g);
  const pen=el('circle',{r:5,fill:COL.berry,stroke:COL.ink,'stroke-width':1.5},g);
  el('circle',{cx:O.x,cy:O.y,r:4,fill:COL.ink},g);
  return {set(r,deg){const a=deg*Math.PI/180,px=O.x+r*Math.cos(a),py=O.y+r*Math.sin(a);
    const mx=(O.x+px)/2,my=(O.y+py)/2,nx=Math.sin(a),ny=-Math.cos(a),hx=mx+nx*70,hy=my+ny*70;
    l1.setAttribute('x1',O.x);l1.setAttribute('y1',O.y);l1.setAttribute('x2',hx);l1.setAttribute('y2',hy);
    l2.setAttribute('x1',hx);l2.setAttribute('y1',hy);l2.setAttribute('x2',px);l2.setAttribute('y2',py);
    hinge.setAttribute('cx',hx);hinge.setAttribute('cy',hy);
    knob.setAttribute('x1',hx);knob.setAttribute('y1',hy);knob.setAttribute('x2',hx+nx*16);knob.setAttribute('y2',hy+ny*16);
    pen.setAttribute('cx',px);pen.setAttribute('cy',py);},g};
}

function cPlay(){
  const alive=start();
  const H=288;const svg=newSvg(H);gridPaper(svg,H);
  const O={x:288,y:144};
  const circ=el('circle',{cx:O.x,cy:O.y,fill:'#fff8',stroke:COL.ink,'stroke-width':3},svg);
  const spokes=el('g',{stroke:COL.long,'stroke-width':3,opacity:.7},svg);
  const dia=el('line',{stroke:COL.berry,'stroke-width':4,'stroke-dasharray':'8 6'},svg);
  const rad=el('line',{stroke:COL.long,'stroke-width':7,'stroke-linecap':'round'},svg);
  el('circle',{cx:O.x,cy:O.y,r:5,fill:COL.ink},svg);
  const rl=txt(svg,0,0,'',{'font-size':18,fill:COL.long});
  const ring=el('circle',{r:17,fill:'none',stroke:COL.sun,'stroke-width':4,class:'pulse'},svg);
  const h=el('circle',{r:12,fill:COL.sun,stroke:COL.ink,'stroke-width':2.5},svg);
  const bd=board();
  const l1=bd.add(''),l2=bd.add('');
  let r=3,ang=-35,showSpokes=false,lastSaid=0,R=3*CM,shown=-1;
  const draw=()=>{
    const a=ang*Math.PI/180,px=O.x+R*Math.cos(a),py=O.y+R*Math.sin(a);
    circ.setAttribute('r',R);
    rad.setAttribute('x1',O.x);rad.setAttribute('y1',O.y);rad.setAttribute('x2',px);rad.setAttribute('y2',py);
    dia.setAttribute('x1',2*O.x-px);dia.setAttribute('y1',2*O.y-py);dia.setAttribute('x2',O.x);dia.setAttribute('y2',O.y);
    h.setAttribute('cx',px);h.setAttribute('cy',py);ring.setAttribute('cx',px);ring.setAttribute('cy',py);
    rl.setAttribute('x',(O.x+px)/2+18*Math.sin(a));rl.setAttribute('y',(O.y+py)/2-18*Math.cos(a)+6);rl.textContent=r+' cm';
    const sp=spokes.children;
    if(showSpokes&&!sp.length)for(let k=0;k<8;k++)el('line',{},spokes);
    if(!showSpokes&&sp.length)spokes.innerHTML='';
    for(let k=0;k<sp.length;k++){const b=a+k*Math.PI/4;sp[k].setAttribute('x1',O.x);sp[k].setAttribute('y1',O.y);sp[k].setAttribute('x2',O.x+R*Math.cos(b));sp[k].setAttribute('y2',O.y+R*Math.sin(b));}
    if(shown!==r){shown=r;l1.innerHTML=`<span class="L">Bán kính</span> = ${r} cm`;l2.innerHTML=`<span class="key">Đường kính</span> = ${r} × 2 = ${r*2} cm`;}
  };
  draw();
  let dragging=false,want=R;
  const loop=()=>{if(!alive())return;const goal=dragging?want:r*CM;R+=(goal-R)*.28;draw();requestAnimationFrame(loop);};
  requestAnimationFrame(loop);
  const speakNow=()=>say(`Bán kính ${r} xăng-ti-mét. Đường kính bằng ${r} nhân hai, bằng ${r*2} xăng-ti-mét.`);
  onDrag(svg,(p,phase)=>{
    if(phase==='up'){dragging=false;if(r!==lastSaid){lastSaid=r;speakNow();}return;}
    dragging=true;ring.remove();
    const d=Math.hypot(p.x-O.x,p.y-O.y);
    want=Math.max(1.6*CM,Math.min(5.3*CM,d));
    const nr=Math.max(2,Math.min(5,Math.round(d/CM)));
    if(nr!==r){r=nr;click();}
    ang=Math.atan2(p.y-O.y,p.x-O.x)*180/Math.PI;
  });
  talk('Đến lượt con! <b>Kéo chấm vàng</b>: kéo ra xa thì hình tròn to ra, kéo vào gần thì nhỏ lại. Nhìn bảng: bán kính đổi thì đường kính đổi theo, luôn <b>gấp 2</b>.',

function cMidpoint(){
  const alive=start();
  stage.innerHTML=`<div class="chips">

  const H=290;const svg=addSvg(H);
  const U=50,X0=80,PY=158,GY=215;
  el('rect',{x:0,y:GY,width:560,height:H-GY,fill:'#eef3f6'},svg);

  el('rect',{x:X0,y:PY-22,width:8*U,height:22,rx:3,fill:'#ffe9a8',stroke:COL.ink,'stroke-width':2},rg);
  for(let i=0;i<=16;i++){const big=i%2===0;el('line',{x1:X0+i*U/2,y1:PY-22,x2:X0+i*U/2,y2:PY-22+(big?10:6),stroke:COL.ink,'stroke-width':big?1.6:1},rg);if(big)txt(rg,X0+i*U/2,PY-3,String(i/2),{'font-size':10,fill:COL.soft});}
  txt(rg,X0,PY-30,'A',{'font-size':20});txt(rg,X0+8*U,PY-30,'B',{'font-size':20});
  const fg=el('g',{style:'transition:transform .35s cubic-bezier(.2,.8,.3,1)'},svg);
  el('path',{d:`M0 ${PY} L-24 ${GY} L24 ${GY} Z`,fill:COL.fence,stroke:COL.ink,'stroke-width':2,'stroke-linejoin':'round'},fg);
  txt(fg,0,GY-10,'M',{'font-size':18,fill:'#fff'});

  let m=2,solved=false,fx=null;
  const update=speak=>{
    const Mx=X0+m*U;fg.style.transform=`translateX(${fx??Mx}px)`;
    let a=0;const drop=GY-PY;
    if(m<4)a=Math.asin(drop/((8-m)*U))*180/Math.PI;else if(m>4)a=-Math.asin(drop/(m*U))*180/Math.PI;
    rg.style.transformOrigin=`${Mx}px ${PY}px`;rg.style.transform=`rotate(${a}deg)`;
    meas.innerHTML='';
    el('line',{x1:X0,y1:245,x2:Mx,y2:245,stroke:COL.long,'stroke-width':6,'stroke-linecap':'round'},meas);
    el('line',{x1:Mx,y1:245,x2:X0+8*U,y2:245,stroke:COL.wide,'stroke-width':6,'stroke-linecap':'round'},meas);
    el('circle',{cx:Mx,cy:245,r:5,fill:COL.ink},meas);
    txt(meas,(X0+Mx)/2,273,`AM = ${m} cm`,{'font-size':17,fill:COL.long});
    txt(meas,(Mx+X0+8*U)/2,273,`MB = ${8-m} cm`,{'font-size':17,fill:COL.wide});
    if(!speak)return;
    if(m===4){
      ting();
      talk('Thước <b>thăng bằng</b> rồi! AM = MB = <b>4 cm</b>. M nằm giữa A và B, và chia AB thành <b>hai phần bằng nhau</b>. M là <b class="key">TRUNG ĐIỂM</b> của đoạn AB.',
           'Thước thăng bằng rồi! A M bằng M B bằng bốn xăng-ti-mét. M nằm giữa A và B, và chia A B thành hai phần bằng nhau. M là trung điểm của đoạn A B.');
      if(!solved){solved=true;
        const bd=board();
        bd.add('AM = MB = <span class="key">4 cm</span>');
        bd.add('AM = MB = AB : 2 = 8 : 2 = 4 cm');
        bd.add('Tâm O là <span class="key">trung điểm</span> của đường kính');
        bd.memo('Trung điểm M của đoạn AB: M nằm giữa A và B, và AM = MB.');
        setButtons();}
    } else {
      boop();
      talk(`M vẫn nằm <b>ở giữa</b> A và B, nhưng AM = ${m} cm, MB = ${8-m} cm: <b>chưa bằng nhau</b> nên thước bị đổ. M chưa phải trung điểm. Dời M tiếp đi!`,

}

/* thẻ số mang theo dấu của nó */
function mkChip(svg,sign,num,x,y){
  const g=el('g',{},svg);
  const w=38+String(num).length*17;
  el('rect',{x:-w/2,y:-26,width:w,height:52,rx:14,fill:'#fff',stroke:COL.ink,'stroke-width':3},g);
  const sg=el('g',{},g);
  const st=txt(sg,0,10,sign,{'font-size':32,fill:sign==='−'?COL.berry:COL.leaf});
  txt(g,0,9,String(num),{'font-size':26});
  const o={g,x,y,w,sign,st,sg,
    sx(){return -o.w/2-18;},
    set(nx,ny){o.x=nx;o.y=ny;g.setAttribute('transform',`translate(${nx} ${ny})`);sg.setAttribute('transform',`translate(${o.sx()} 0)`);},
    fly(nx,ny,ms=900,half){const x0=o.x,y0=o.y;let did=false;
      return tween(ms,(e,p)=>{const xx=lerp(x0,nx,e),yy=lerp(y0,ny,e)-66*Math.sin(Math.PI*e);
        g.setAttribute('transform',`translate(${xx} ${yy})`);
        if(half&&p>=.5&&!did){did=true;half();}}).then(()=>{o.x=nx;o.y=ny;});},
    flip(ns){o.sign=ns;tone(880,.12,'square',.08);
      return tween(340,(e,p)=>{const k=Math.max(.03,Math.abs(1-2*p));
        if(p>=.5){st.textContent=ns;st.setAttribute('fill',ns==='−'?COL.berry:COL.leaf);}
        sg.setAttribute('transform',`translate(${o.sx()} 0) scale(${k} 1)`);});}
  };
  o.set(x,y);return o;
}
const EXS=[90,230,370,500];
function exprChips(svg,y=60){
  return [mkChip(svg,'',435,EXS[0],y),mkChip(svg,'−',360,EXS[1],y),mkChip(svg,'+',565,EXS[2],y),mkChip(svg,'−',140,EXS[3],y)];
}

function isoBox(svg,x0,y0,L,W,H,u,c={}){
  const dx=W*u*.52,dy=W*u*.30,fy=y0-H*u;
  const g=el('g',{},svg);
  const front=el('path',{d:`M${x0} ${y0}h${L*u}v${-H*u}h${-L*u}Z`,fill:c.f||'#ffd97f',stroke:COL.ink,'stroke-width':3,'stroke-linejoin':'round'},g);
  const top=el('path',{d:`M${x0} ${fy}l${dx} ${-dy}h${L*u}l${-dx} ${dy}Z`,fill:c.t||'#ffeab3',stroke:COL.ink,'stroke-width':3,'stroke-linejoin':'round'},g);
  const side=el('path',{d:`M${x0+L*u} ${y0}l${dx} ${-dy}v${-H*u}l${-dx} ${dy}Z`,fill:c.s||'#eab54e',stroke:COL.ink,'stroke-width':3,'stroke-linejoin':'round'},g);
  return {g,front,top,side,dx,dy};
}

function bStretch(){
  const alive=start();
  const svg=newSvg(320);
  const u=36,x0=120,y0=268,W=3,H=3;
  const gBox=el('g',{},svg);
  const ring=el('circle',{r:19,fill:'none',stroke:COL.sun,'stroke-width':4,class:'pulse'},svg);
  const hd=el('circle',{r:13,fill:COL.sun,stroke:COL.ink,'stroke-width':3},svg);
  const bd=board();
  const line1=bd.add('');
  let L=5,solved=false,dragging=false,shownL=-1;
  const draw=()=>{
    gBox.innerHTML='';
    const b=isoBox(gBox,x0,y0,L,W,H,u);gBox.appendChild(b.g);
    const dx=b.dx,dy=b.dy;
    txt(gBox,x0+L*u/2,y0+26,'dài '+(Math.round(L*10)/10)+' ô',{'font-size':19,fill:COL.long});
    txt(gBox,x0-14,y0-H*u/2+6,'cao 3 ô',{'font-size':19,fill:COL.leaf,'text-anchor':'end'});
    txt(gBox,x0+L*u+dx/2+14,y0-dy/2-2,'rộng 3 ô',{'font-size':19,fill:COL.wide,'text-anchor':'start'});
    const hx=x0+L*u+dx/2,hy=y0-dy/2-H*u/2;
    hd.setAttribute('cx',hx);hd.setAttribute('cy',hy);ring.setAttribute('cx',hx);ring.setAttribute('cy',hy);
    const Lr=Math.round(L*10)/10;
    if(shownL!==Lr){shownL=Lr;line1.innerHTML=`dài ${Lr} · rộng 3 · cao 3 ${Lr===3?'→ <span class="key">BẰNG NHAU!</span>':'→ chưa bằng nhau'}`;}
  };
  draw();
  onDrag(svg,(p,phase)=>{
    if(phase==='up'){dragging=false;release();return;}
    dragging=true;ring.remove();
    L=Math.max(2,Math.min(5,(p.x-x0-W*u*.26)/u));
    draw();
  });
  talk('Đây là <b>hình hộp chữ nhật</b>: dài 5, rộng 3, cao 3. Nó dài quá! Con <b>kéo chấm vàng</b> (hoặc bấm nút) để co cái hộp lại. Thử làm cho <b>dài, rộng, cao bằng nhau</b> xem nó biến thành gì!',
       'Đây là hình hộp chữ nhật: dài 5, rộng 3, cao 3. Nó dài quá! Con kéo chấm vàng, hoặc bấm nút, để co cái hộp lại. Thử làm cho dài, rộng, cao bằng nhau xem nó biến thành gì!');
  const nudge=async d=>{
    const t=Math.max(2,Math.min(5,Math.round(L)+d));const L0=L;click();
    await tween(360,e=>{L=lerp(L0,t,e);draw();});
    release();
  };
  function release(){
    L=Math.max(2,Math.min(5,Math.round(L)));draw();
    if(L===3&&!solved){
      solved=true;fanfare();
      bd.add('dài = rộng = cao = 3 → <span class="key">HÌNH LẬP PHƯƠNG</span>');
      bd.memo('Hình lập phương là hình hộp chữ nhật đặc biệt: chiều dài, chiều rộng, chiều cao bằng nhau, nên 6 mặt đều là hình vuông.');
      talk('<b>TUYỆT!</b> Dài = rộng = cao = 3. Mọi cạnh bằng nhau, 6 mặt đều thành <b>hình vuông</b> — cái hộp đã biến thành <b class="key">HÌNH LẬP PHƯƠNG</b>!',
           'Tuyệt! Dài bằng rộng bằng cao bằng 3. Mọi cạnh bằng nhau, 6 mặt đều thành hình vuông — cái hộp đã biến thành hình lập phương!');
      buttons([{label:'◀ Co lại',on:()=>nudge(-1)},{label:'Kéo dài ra ▶',on:()=>nudge(1)},{label:'Câu đố ▸',kind:'go',on:next}]);
    } else if(!solved){
      boop();
      talk(`Dài ${L}, rộng 3, cao 3 — vẫn có cạnh dài cạnh ngắn, nên đây là <b>hình hộp chữ nhật</b>. Kéo tiếp cho <b>cả ba số bằng nhau</b> xem điều gì xảy ra!`,
           `Dài ${L}, rộng 3, cao 3 — vẫn có cạnh dài cạnh ngắn, nên đây là hình hộp chữ nhật. Kéo tiếp cho cả ba số bằng nhau xem điều gì xảy ra!`);
    }
  }
  buttons([{label:'◀ Co lại',on:()=>nudge(-1)},{label:'Kéo dài ra ▶',on:()=>nudge(1)}]);
}

const CANDY_COLS=['#e8475f','#2f7fd8','#4f9a45','#f08a24','#9b59b6'];
function candy(svg,x,y,c){
  const g=el('g',{},svg);
  el('circle',{r:11,fill:c,stroke:COL.ink,'stroke-width':2},g);
  el('circle',{cx:-4,cy:-4,r:3,fill:'#ffffffb0'},g);
  const o={g,x,y,
    set(nx,ny){o.x=nx;o.y=ny;g.setAttribute('transform',`translate(${nx} ${ny})`);},
    fly(nx,ny,ms=600){const x0=o.x,y0=o.y;return tween(ms,e=>{g.setAttribute('transform',`translate(${lerp(x0,nx,e)} ${lerp(y0,ny,e)-46*Math.sin(Math.PI*e)})`);}).then(()=>{o.x=nx;o.y=ny;});}};
  o.set(x,y);return o;
}

  };

function shareScreen(total,isRemain){
  return function(){
    const alive=start();
    const svg=newSvg(300);
    const plateX=[130,285,440];
    plateX.forEach((x,i)=>{
      el('ellipse',{cx:x,cy:262,rx:62,ry:17,fill:'#fff',stroke:COL.ink,'stroke-width':3},svg);
      txt(svg,x,296,'bạn '+(i+1),{'font-size':15,fill:COL.soft});
    });
    el('rect',{x:34,y:28,width:244,height:66,rx:14,fill:'#fdf1d7',stroke:COL.ink,'stroke-width':3},svg);
    const pileT=txt(svg,470,56,total+' viên',{'font-size':26,fill:COL.berry});
    txt(svg,470,82,'trong túi',{'font-size':15,fill:COL.soft});
    const eachT=txt(svg,470,130,'mỗi bạn: 0',{'font-size':19,fill:COL.wide});
    const pile=[];
    for(let i=0;i<total;i++)pile.push(candy(svg,56+(i%8)*28,50+Math.floor(i/8)*28,CANDY_COLS[i%CANDY_COLS.length]));
    const plateN=[0,0,0];let left=total,round=0;
    const bd=board();
    const spotOn=(p,n)=>({x:plateX[p]-28+(n%3)*28,y:250-Math.floor(n/3)*24});
    if(!isRemain)
      talk(`Trong túi có <b>${total} viên kẹo</b>, chia đều cho <b>3 bạn</b>. Chia kiểu công bằng nhất: mỗi lượt phát cho <b>mỗi bạn 1 viên</b>. Bấm <b>Chia một lượt</b>!`,
           `Trong túi có ${total} viên kẹo, chia đều cho 3 bạn. Chia kiểu công bằng nhất: mỗi lượt phát cho mỗi bạn 1 viên. Bấm chia một lượt!`);
    else
      talk(`Lần này túi có <b>${total} viên</b>, vẫn chia cho <b>3 bạn</b>. ${total} có chia đều được không nhỉ? Chia thử xem!`,
           `Lần này túi có ${total} viên, vẫn chia cho 3 bạn. ${total} có chia đều được không nhỉ? Chia thử xem!`);
    const deal=async()=>{
      lockButtons(true);round++;
      for(let p=0;p<3;p++){
        const c=pile.pop();left--;
        const s=spotOn(p,plateN[p]);
        await c.fly(s.x,s.y,480);if(!alive())return;plateN[p]++;tone(620+p*110,.09);
      }
      pileT.textContent=left+' viên';popEl(pileT);
      eachT.textContent='mỗi bạn: '+plateN[0];popEl(eachT);
      if(left>=3){
        talk(`Lượt ${round}: mỗi bạn thêm 1 viên, ai cũng có <b>${plateN[0]} viên</b>. Túi còn ${left} viên — còn đủ chia tiếp!`,
             `Lượt ${round}: mỗi bạn thêm 1 viên, ai cũng có ${plateN[0]} viên. Túi còn ${left} viên — còn đủ chia tiếp!`);
        buttons([{label:'Chia một lượt nữa',kind:'go',on:deal}]);lockButtons(false);
      } else if(left===0){
        ting();fanfare();
        bd.add(`${total} : 3 = <span class="key">${plateN[0]}</span>`);
        bd.add('Túi hết sạch → <span class="key">CHIA HẾT</span>');
        bd.memo(`${total} viên chia đều 3 bạn, mỗi bạn ${plateN[0]} viên, không thừa viên nào: ${total} : 3 = ${plateN[0]}. Đó là phép chia hết.`);
        talk(`Túi <b>hết sạch</b>, ai cũng đúng <b>${plateN[0]} viên</b>, không thừa viên nào. Đó là <b class="key">CHIA HẾT</b>: ${total} : 3 = ${plateN[0]}.`,
             `Túi hết sạch, ai cũng đúng ${plateN[0]} viên, không thừa viên nào. Đó là chia hết: ${total} chia 3 bằng ${plateN[0]}.`);
        buttons([{label:isRemain?'Câu đố ▸':'Túi kẹo mới ▸',kind:'go',on:next}]);
      } else {
        boop();
        talk(`Túi còn <b>${left} viên</b> mà có tận 3 bạn — phát nữa thì có bạn được, bạn không. <b>Bất công!</b> Thử bấm chia xem sao.`,
             `Túi còn ${left} viên mà có tận 3 bạn — phát nữa thì có bạn được, bạn không. Bất công! Thử bấm chia xem sao.`);
        buttons([{label:'Cứ thử chia lượt nữa',kind:'go',on:async()=>{
          lockButtons(true);
          const moves=pile.map((c,i)=>({c,x0:c.x,y0:c.y,p:i}));
          for(const m of moves){await m.c.fly(plateX[m.p]-28,180,420);if(!alive())return;}
          boop();await wait(400);if(!alive())return;
          for(const m of moves){await m.c.fly(m.x0,m.y0,420);if(!alive())return;}
          bd.add(`${total} : 3 = 4 <span class="key">(dư ${left})</span>`);
          bd.add(`số dư ${left} < số chia 3`);
          bd.memo(`${total} : 3 = 4 (dư ${left}). Số dư luôn bé hơn số chia — vì nếu còn đủ ${3} viên thì lại chia thêm được một lượt nữa.`);
          talk(`Thấy chưa: chỉ có ${left} viên, bạn thứ ba đành chịu, nên kẹo phải <b>quay về túi</b>. ${left} viên thừa ra gọi là <b class="key">SỐ DƯ</b>: ${total} : 3 = 4 (dư ${left}). Số dư luôn <b>bé hơn 3</b>, vì còn đủ 3 viên là chia được tiếp!`,
               `Thấy chưa: chỉ có ${left} viên, bạn thứ ba đành chịu, nên kẹo phải quay về túi. ${left} viên thừa ra gọi là số dư: ${total} chia 3 bằng 4, dư ${left}. Số dư luôn bé hơn 3, vì còn đủ 3 viên là chia được tiếp!`);
          buttons([{label:'Câu đố ▸',kind:'go',on:next}]);
        }}]);
      }
    };
    buttons([{label:'Chia một lượt',kind:'go',on:deal}]);
  };
}

function confetti(n=90){
  if(reduce)return;
  const host=document.createElement('div');
  host.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden';
  document.body.appendChild(host);
  const cols=['#e8475f','#2f7fd8','#ffd23f','#4f9a45','#f08a24','#9b59b6'];
  for(let i=0;i<n;i++){
    const d=document.createElement('i');const s=6+Math.random()*9;
    d.style.cssText=`position:absolute;top:-24px;left:${Math.random()*100}%;width:${s}px;height:${s*.62}px;background:${cols[i%6]};border-radius:2px;display:block`;
    host.appendChild(d);
    if(d.animate)d.animate(
      [{transform:'translateY(0) rotate(0deg)',opacity:1},{transform:`translateY(${innerHeight+60}px) rotate(${420+Math.random()*720}deg)`,opacity:.9}],
      {duration:2300+Math.random()*1900,delay:Math.random()*600,easing:'cubic-bezier(.25,.6,.4,1)',fill:'forwards'});
  }
  setTimeout(()=>host.remove(),5400);
}

    yearT.textContent=t===0?'NĂM NAY':(t>0?`SAU ${t} NĂM`:`${-t} NĂM TRƯỚC`);
    const ages=base.map(b=>b+t);
    names.forEach((nm,r)=>{
      const g=els.bars[r];g.innerHTML='';
      for(let i=0;i<ages[r];i++){
        const old=i<base[r]+Math.min(0,t)||t>=0&&i<base[r];
        el('rect',{x:x0+i*u,y:rows[r]-12,width:u-2,height:24,rx:4,fill:i<Math.min(...ages)?colors[r]:COL.sun,stroke:COL.ink,'stroke-width':1.6},g);
      }
      els.nums[r].setAttribute('x',x0+ages[r]*u+10);

    });
    const gg=els.gapG;gg.innerHTML='';
    const a=x0+Math.min(...ages)*u,b=x0+Math.max(...ages)*u;
    el('line',{x1:a,y1:60,x2:a,y2:190,stroke:COL.berry,'stroke-width':2,'stroke-dasharray':'5 5'},gg);
    el('line',{x1:b,y1:60,x2:b,y2:190,stroke:COL.berry,'stroke-width':2,'stroke-dasharray':'5 5'},gg);
    el('path',{d:`M${a} 206 V214 H${b} V206`,fill:'none',stroke:COL.berry,'stroke-width':3},gg);
    txt(gg,(a+b)/2,236,`hơn ${Math.abs(base[0]-base[1])} tuổi`,{'font-size':17,fill:COL.berry});
    return ages;
  }};
}

const ri=n=>Math.floor(Math.random()*n);
const DRILLS=[
  {id:'bu10',name:'Bù 10 khi cộng',tip:'8 + 7: mượn 2 cho tròn 10',
   lesson:[['Tính 8 + 7 kiểu thần tốc:','Tính 8 cộng 7 kiểu thần tốc.'],

   gen(){const a=6+ri(4),b=5+ri(5);const m=10-a;
     return {q:`${a} + ${b}`,ans:a+b,
       ex:`${a} + ${b} = ${a} + <span class="key">${m}</span> + ${b-m} = 10 + ${b-m} = <b>${a+b}</b>`,

  {id:'demtoi',name:'Trừ kiểu đếm tới',tip:'100 − 64: nhảy 64 → 70 → 100',
   lesson:[['Tính 100 − 64 không cần đặt tính:','Tính 100 trừ 64 không cần đặt tính.'],
     ['64 <span class="key">+ 6</span> → 70 <span class="key">+ 30</span> → 100','Từ 64, thêm 6 là tới 70. Thêm 30 nữa là tới 100.'],
     ['Đã thêm: 6 + 30 = <b>36</b>. Vậy 100 − 64 = 36','Đã thêm tất cả 6 cộng 30 bằng 36. Vậy 100 trừ 64 bằng 36.'],
     ['memo:Trừ cho 100: đừng mượn lung tung! Đếm tới: nhảy lên chục tròn gần nhất, rồi nhảy tới 100. Cộng các bước nhảy là ra.']],

       exv:`Từ ${b} thêm ${s1} là ${b+s1}, thêm ${s2} nữa là 100. ${s1} cộng ${s2} bằng ${100-b}.`};}},
  {id:'nhan5',name:'Nhân 5 thần tốc',tip:'× 10 rồi chia 2',
   lesson:[['Tính 8 × 5 kiểu thần tốc:','Tính 8 nhân 5 kiểu thần tốc.'],
     ['8 × <span class="key">10</span> = 80 (dễ ợt, thêm số 0)','Tám nhân mười bằng 80 — dễ ợt, chỉ thêm số 0.'],

     ['memo:Nhân với 5: nhân với 10 trước (thêm số 0), rồi chia 2. Vì 5 là một nửa của 10 — “bán” là một nửa mà!']],
   gen(){const n=4+ri(13);

  {id:'nhan9',name:'Nhân 9 thần tốc',tip:'× 10 rồi bớt 1 lần',
   lesson:[['Tính 7 × 9 kiểu thần tốc:','Tính 7 nhân 9 kiểu thần tốc.'],
     ['9 lần = <span class="key">10 lần − 1 lần</span>','Chín lần tức là mười lần bớt đi một lần.'],
     ['7 × 10 = 70, bớt 7 → 70 − 7 = <b>63</b>','Bảy nhân mười bằng 70, bớt 7 còn 63.'],
     ['memo:Nhân với 9: nhân với 10 rồi bớt đi chính số đó một lần. 9 thếp kẹo = 10 thếp bớt 1 thếp!']],
   gen(){const n=3+ri(7);

  {id:'nhan4',name:'Nhân 4: gấp đôi 2 lần',tip:'7 × 4: 7 → 14 → 28',
   lesson:[['Tính 7 × 4 kiểu thần tốc:','Tính 7 nhân 4 kiểu thần tốc.'],
     ['4 = 2 × 2 → <span class="key">gấp đôi, rồi gấp đôi nữa</span>','Bốn bằng hai nhân hai, nên chỉ cần gấp đôi, rồi gấp đôi lần nữa.'],
     ['7 → gấp đôi → 14 → gấp đôi → <b>28</b>','Bảy gấp đôi là 14, gấp đôi nữa là 28.'],
     ['memo:Nhân với 4: gấp đôi 2 lần. Nhân với 8 thì gấp đôi 3 lần. Gấp đôi là phép dễ nhất trong các phép nhân!']],
   gen(){const n=3+ri(10);
     return {q:`${n} × 4`,ans:n*4,
       ex:`${n} → gấp đôi → ${n*2} → gấp đôi → <b>${n*4}</b>`,
       exv:`${n} gấp đôi là ${n*2}, gấp đôi nữa là ${n*4}.`};}},
  {id:'tronchuc',name:'Cộng trừ chục tròn',tip:'47 + 30: chỉ hàng chục nhảy',
   lesson:[['Tính 47 + 30 kiểu thần tốc:','Tính 47 cộng 30 kiểu thần tốc.'],
     ['30 là <b>3 chục</b> → chỉ <span class="key">hàng chục</span> thay đổi','30 là 3 chục, nên chỉ hàng chục thay đổi.'],
     ['4 chục + 3 chục = 7 chục → 47 + 30 = <b>77</b>','4 chục cộng 3 chục bằng 7 chục. Vậy 47 cộng 30 bằng 77.'],
     ['memo:Cộng hay trừ số tròn chục: hàng đơn vị đứng yên, chỉ hàng chục nhảy. 47+30: số 7 ngồi im, số 4 thành số 7.']],
   gen(){const x=10*(2+ri(6))+1+ri(9);const plus=Math.random()<.5;

     ['memo:Phép chia là phép nhân đi ngược: 24 : 6 = ? tức là 6 × ? = 24. Thuộc bảng nhân là thắng bảng chia!']],
   gen(){
     if(Math.random()<.3){const b=2+ri(7),q2=2+ri(8),m=b*q2;

     const d=DRILLS[ri(6)];return d.gen();}}
];

    <h4>${d.name}</h4><p>${d.tip}</p></button>`).join('')}</div>`;
  stage.querySelectorAll('.skill').forEach(b=>b.onclick=()=>{click();drillLesson(DRILLS.find(d=>d.id===b.dataset.id));});
  talk('Đây là <b>Phòng Luyện Não</b>! Mỗi chiêu là một mẹo tính nhanh. Học chiêu xong thì luyện 5 câu — đúng từ 4 câu trở lên được <b class="key">1 sao</b>, mỗi chiêu tối đa 3 sao. Luyện mỗi ngày vài vòng cho não chạy vù vù!',
       'Đây là Phòng Luyện Não! Mỗi chiêu là một mẹo tính nhanh. Học chiêu xong thì luyện 5 câu — đúng từ 4 câu trở lên được 1 sao, mỗi chiêu tối đa 3 sao. Luyện mỗi ngày vài vòng cho não chạy vù vù!');
  buttons([{label:'← Về bản đồ',kind:'ghost',on:()=>go(null)}]);
}
function drillLesson(d){
  start();
  stage.innerHTML='';
  const bd=board();
  talk(`Chiêu: <b>${d.name}</b>. Nhìn lên bảng nhé!`,`Chiêu: ${d.name}. Nhìn lên bảng nhé!`);
  let i=0;
  const step=()=>{
    const L=d.lesson[i];
    if(typeof L[0]==='string'&&L[0].startsWith('memo:')){bd.memo(L[0].slice(5));say(L[0].slice(5));}
    else{bd.add(L[0]);say(L[1]);}
    i++;
    if(i<d.lesson.length)buttons([{label:'Tiếp ▸',kind:'go',on:step}]);
    else buttons([{label:`Luyện ${d.mix?10:5} câu ▸`,kind:'go',on:()=>drillRound(d)},{label:'← Chọn chiêu khác',kind:'ghost',on:()=>go('drill')}]);
  };
  step();
}
function drillRound(d){
  const alive=start();
  const N=d.mix?10:5;
  let qi=0,okN=0,streak=0;
  const show=()=>{
    const it=d.gen();
    const set=new Set([it.ans]);
    while(set.size<3){const delta=(1+ri(3))*(Math.random()<.5?-1:1)*(it.ans>40?10:1);const v=it.ans+delta;if(v>0)set.add(v);}
    const opts=[...set].sort(()=>Math.random()-.5);
    stage.innerHTML=`<div class="qmeta"><span class="qdots">${Array.from({length:N},(_,k)=>`<i id="qd${k}" class="${k<qi?'':''}"></i>`).join('')}</span><span class="streak">chuỗi đúng: ${streak} ✦</span></div><div class="qbig">${it.q} = ?</div>`;
    history.forEach((h,k)=>{const e=$('#qd'+k);if(e)e.className=h?'ok':'bad';});
    cap.innerHTML=`Câu ${qi+1}/${N} · chiêu <b>${d.name}</b>`;
    say(it.q.replace('−',' trừ ').replace('+',' cộng ').replace('×',' nhân ').replace(':',' chia ')+' bằng mấy?');
    buttons(opts.map(v=>({label:String(v),on:async()=>{
      lockButtons(true);
      const right=v===it.ans;
      history.push(right);
      if(right){okN++;streak++;ting();if(streak>0&&streak%5===0)confetti(40);
        cap.innerHTML=`<b style="color:var(--leaf)">Đúng!</b> ${it.ex}`;say('Đúng! '+it.exv);}
      else{streak=0;boop();
        cap.innerHTML=`<b style="color:var(--berry)">Chưa đúng.</b> ${it.ex}`;say('Chưa đúng. '+it.exv);}
      const e=$('#qd'+qi);if(e)e.className=right?'ok':'bad';
      qi++;
      await wait(right?1500:2600);if(!alive())return;
      qi<N?show():finish();
    }})));
  };
  const history=[];
  const finish=()=>{
    const passed=okN>=Math.ceil(N*0.8);
    stage.innerHTML=`<div class="done"><div class="qbig">${okN}/${N}</div><h2>${passed?'Tuyệt vời!':'Gần được rồi!'}</h2></div>`;
    if(passed){
      const before=starsOf(d.id);addStar(d.id);setDone(WORLDS.drill.key);
      celebrate();
      const now=starsOf(d.id);
      talk(now>before?`Đúng ${okN}/${N} câu — con nhận được <b class="key">1 sao</b>! Chiêu “${d.name}” giờ có ${'★'.repeat(now)}${now>=3?' — TỐI ĐA, cao thủ thật sự!':'.'}`:`Đúng ${okN}/${N} câu! Chiêu này đã đủ 3 sao — con là cao thủ rồi, luyện chiêu khác thôi!`,
           now>before?`Đúng ${okN} trên ${N} câu — con nhận được 1 sao!`:`Đúng ${okN} trên ${N} câu! Chiêu này đã đủ 3 sao rồi.`);
    } else {
      boop();
      talk(`Đúng ${okN}/${N} câu. Cần đúng ${Math.ceil(N*0.8)} câu để lấy sao — xem lại chiêu rồi thử lại, lần này chắc chắn được!`,
           `Đúng ${okN} trên ${N} câu. Cần đúng ${Math.ceil(N*0.8)} câu để lấy sao — xem lại chiêu rồi thử lại, lần này chắc chắn được!`);
    }
    buttons([{label:'Luyện vòng nữa',kind:'go',on:()=>drillRound(d)},{label:'Xem lại chiêu',kind:'ghost',on:()=>drillLesson(d)},{label:'Chọn chiêu khác',on:()=>go('drill')}]);
  };
  show();
}
